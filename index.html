      </select>
      <input type="month" id="filterMonth" value="${UI.filters.month}">
      <button class="btn-ghost" id="btnClearFilters">Limpar</button>
    </div>

    <div class="panel">
      <div id="expensesList"></div>
    </div>
  `;

  document.getElementById('btnNewExpense').addEventListener('click', ()=> openExpenseModal());
  document.getElementById('btnDuplicateLast').addEventListener('click', ()=>{
    const list = [...Store.getExpenses()].sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
    if(list.length === 0){
      toast('Nenhum gasto lançado ainda para duplicar.');
      return;
    }
    const last = list[0];
    openExpenseModal(null, {
      description: last.description,
      value: last.value,
      date: todayISO(),
      categoryId: last.categoryId,
      paymentMethod: last.paymentMethod,
      cardId: last.cardId,
      installments: last.installments,
      responsible: last.responsible,
      note: last.note
    });
  });
  document.getElementById('filterText').addEventListener('input', e=>{ UI.filters.text = e.target.value; renderExpensesList(); });
  document.getElementById('filterCategory').addEventListener('change', e=>{ UI.filters.categoryId = e.target.value; renderExpensesList(); });
  document.getElementById('filterCard').addEventListener('change', e=>{ UI.filters.cardId = e.target.value; renderExpensesList(); });
  document.getElementById('filterMonth').addEventListener('change', e=>{ UI.filters.month = e.target.value; renderExpensesList(); });
  document.getElementById('btnClearFilters').addEventListener('click', ()=>{
    UI.filters = { text:'', categoryId:'', cardId:'', month:'', dateFrom:'', dateTo:'' };
    renderLancamentos();
  });

  renderExpensesList();
}

function renderExpensesList(){
  const container = document.getElementById('expensesList');
  if(!container) return;
  let expenses = [...Store.getExpenses()].sort((a,b)=> new Date(b.date) - new Date(a.date));

  const f = UI.filters;
  if(f.text){
    const t = f.text.toLowerCase();
    expenses = expenses.filter(e => e.description.toLowerCase().includes(t) || (e.note||'').toLowerCase().includes(t));
  }
  if(f.categoryId) expenses = expenses.filter(e => e.categoryId === f.categoryId);
  if(f.cardId) expenses = expenses.filter(e => e.cardId === f.cardId);
  if(f.month){
    const [fy, fm] = f.month.split('-').map(Number);
    expenses = expenses.filter(e => {
      const d = parseISODate(e.date);
      return d.getFullYear() === fy && (d.getMonth()+1) === fm;
    });
  }

  if(expenses.length === 0){
    container.innerHTML = '<div class="empty-state">Nenhum lançamento encontrado com os filtros atuais.</div>';
    return;
  }

  container.innerHTML = `<div class="table-list">` + expenses.map(e => {
    const cat = getCategoryById(e.categoryId);
    const card = getCardById(e.cardId);
    const n = Math.max(1, parseInt(e.installments,10)||1);
    return `
      <div class="table-row" data-id="${e.id}">
        <div class="col-tag" style="background:${cat?cat.color:'#868E96'}22; color:${cat?cat.color:'#868E96'}">${cat?escapeHTML(cat.name):'Sem categoria'}</div>
        <div class="col-main">
          <span class="row-title">${escapeHTML(e.description)}</span>
          <span class="row-sub">${formatDateBR(e.date)} · ${paymentMethodLabel(e.paymentMethod)}${card?' · <span class="inline-dot" style="background:'+(card.color||DEFAULT_CARD_COLOR)+'"></span>'+escapeHTML(card.name):''}${n>1?' · '+n+'x de '+brl(e.value/n):''} · ${escapeHTML(getUserName(e.responsible))}${e.note?' · '+escapeHTML(e.note):''}</span>
        </div>
        <div class="col-value">${brl(e.value)}</div>
        <div class="col-actions">
          <button class="icon-btn" data-action="edit-expense" title="Editar">${icon('edit')}</button>
          <button class="icon-btn danger" data-action="delete-expense" title="Excluir">${icon('trash')}</button>
        </div>
      </div>`;
  }).join('') + `</div>`;

  container.querySelectorAll('[data-action="edit-expense"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.target.closest('.table-row').dataset.id;
      openExpenseModal(id);
    });
  });
  container.querySelectorAll('[data-action="delete-expense"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.target.closest('.table-row').dataset.id;
      confirmAction('Excluir lançamento?', 'Essa ação não pode ser desfeita.', ()=>{
        const list = Store.getExpenses().filter(x => x.id !== id);
        Store.setExpenses(list);
        renderExpensesList();
        refreshAllSaldos();
        toast('Lançamento excluído');
      });
    });
  });
}

function paymentMethodLabel(pm){
  const map = { dinheiro:'Dinheiro', debito:'Débito', credito:'Crédito', pix:'Pix', transferencia:'Transferência' };
  return map[pm] || pm || '—';
}

function openExpenseModal(id, prefill){
  UI.editingExpenseId = id || null;
  const categories = Store.getCategories();
  const cards = Store.getCards();
  const existing = id ? Store.getExpenses().find(e=>e.id===id) : null;
  // prefill: usado por "Salvar e adicionar outro" e por "Duplicar último gasto"
  // pra já vir com os campos mais repetitivos preenchidos, sem ser uma edição de verdade.
  const base = existing || prefill || null;

  if(categories.length === 0){
    toast('Cadastre uma categoria antes de lançar um gasto.');
    return;
  }

  const html = `
    <form id="expenseForm" class="modal-form">
      <h2>${existing ? 'Editar gasto' : 'Novo gasto'}</h2>
      <div class="form-grid">

        </label>
        <label>
          <span>Valor total (R$)</span>
          <input type="text" inputmode="decimal" name="value" required value="${(base && base.value)?String(base.value).replace('.', ','):''}" placeholder="0,00">
        </label>
        <label>
          <span>Data da compra</span>
          <input type="date" name="date" required value="${base?base.date:todayISO()}">
        </label>
        <label>
          <span>Categoria</span>
          <select name="categoryId" required>
            ${categories.map(c=>`<option value="${c.id}" ${base&&base.categoryId===c.id?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}
          </select>
        </label>
        <label>
          <span>Forma de pagamento</span>
          <select name="paymentMethod" id="fieldPaymentMethod">
            <option value="credito" ${base&&base.paymentMethod==='credito'?'selected':''}>Cartão de crédito</option>
            <option value="debito" ${base&&base.paymentMethod==='debito'?'selected':''}>Cartão de débito</option>
            <option value="dinheiro" ${base&&base.paymentMethod==='dinheiro'?'selected':''}>Dinheiro</option>
            <option value="pix" ${base&&base.paymentMethod==='pix'?'selected':''}>Pix</option>
            <option value="transferencia" ${base&&base.paymentMethod==='transferencia'?'selected':''}>Transferência</option>
          </select>
        </label>
        <label id="fieldCardWrap">
          <span>Cartão de crédito utilizado</span>
          <select name="cardId">
            <option value="">Selecione um cartão</option>
            ${cards.map(c=>`<option value="${c.id}" ${base&&base.cardId===c.id?'selected':''}>${escapeHTML(c.name)} (${escapeHTML(c.bank)})</option>`).join('')}
          </select>
        </label>
        <label id="fieldInstallmentsWrap">
          <span>Número de parcelas</span>
          <input type="number" name="installments" min="1" max="60" value="${(base && base.installments)?base.installments:1}">
        </label>
        <label>
          <span>Responsável (opcional)</span>
          <select name="responsible">
            ${userOptionsHTML(base?base.responsible:'', 'form')}
          </select>
        </label>
        <label class="span-2">
          <span>Observação</span>
          <textarea name="note" rows="2" maxlength="200" placeholder="Opcional">${base?escapeHTML(base.note||''):''}</textarea>
        </label>
      </div>
      <div id="installmentPreview" class="installment-preview"></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="close-modal">Cancelar</button>
        ${!existing ? `<button type="button" class="btn-ghost" id="btnSaveAddAnother">Salvar e adicionar outro</button>` : ''}
        <button type="submit" class="btn-primary">${existing?'Salvar alterações':'Adicionar gasto'}</button>
      </div>
    </form>
  `;
  openModal(html);

  const form = document.getElementById('expenseForm');
  const pmSelect = form.paymentMethod;
  const cardWrap = document.getElementById('fieldCardWrap');
  const instWrap = document.getElementById('fieldInstallmentsWrap');

  function toggleFields(){
    const isCredit = pmSelect.value === 'credito';
    cardWrap.style.display = isCredit ? '' : 'none';
    instWrap.style.display = isCredit ? '' : 'none';
    if(!isCredit){ form.installments.value = 1; }
    updateInstallmentPreview();
  }

  function updateInstallmentPreview(){
    const previewEl = document.getElementById('installmentPreview');
    const total = parseCurrencyBR(form.value.value);
    const n = parseInt(form.installments.value,10) || 1;
    const dateVal = form.date.value;
    if(!total || isNaN(total) || !dateVal || pmSelect.value !== 'credito' || n <= 1){
      previewEl.innerHTML = '';
      return;
    }
    const card = getCardById(form.cardId.value);
    const fakeExpense = { value: total, installments: n, date: dateVal };
    const schedule = buildInstallmentSchedule(fakeExpense, card);
    previewEl.innerHTML = `
      <div class="preview-title">Distribuição das parcelas</div>
      <div class="preview-grid">
        ${schedule.map(s => `<div class="preview-item"><span>${MONTH_SHORT[s.month]}/${s.year}</span><strong>${brl(s.value)}</strong></div>`).join('')}
      </div>`;
  }

  pmSelect.addEventListener('change', toggleFields);
  form.value.addEventListener('input', updateInstallmentPreview);
  form.installments.addEventListener('input', updateInstallmentPreview);
  form.date.addEventListener('change', updateInstallmentPreview);
  form.cardId.addEventListener('change', updateInstallmentPreview);
  toggleFields();

  // Valida e salva o formulário atual; devolve o payload salvo (ou null se inválido),
  // sem decidir o que acontece depois — isso fica a cargo de quem chamou.
  function validateAndSave(){
    const fd = new FormData(form);
    const paymentMethod = fd.get('paymentMethod');
    const isCredit = paymentMethod === 'credito';
    const parsedValue = parseCurrencyBR(fd.get('value'));
    if(isNaN(parsedValue) || parsedValue <= 0){
      toast('Informe um valor válido, ex: 150,50');
      return null;
    }
    const payload = {
      id: existing ? existing.id : uid('exp'),
      description: fd.get('description').trim(),
      value: parsedValue,
      date: fd.get('date'),
      categoryId: fd.get('categoryId'),
      paymentMethod,
      cardId: isCredit ? (fd.get('cardId') || '') : '',
      installments: isCredit ? clamp(parseInt(fd.get('installments'),10)||1, 1, 60) : 1,
      responsible: fd.get('responsible') || '',
      note: (fd.get('note')||'').trim(),
      createdAt: existing ? existing.createdAt : Date.now()
    };
    if(isCredit && !payload.cardId){
      toast('Selecione o cartão utilizado.');
      return null;
    }
    const list = Store.getExpenses();
    if(existing){
      const idx = list.findIndex(x=>x.id===existing.id);
      list[idx] = payload;
    } else {
      list.push(payload);
    }
    Store.setExpenses(list);
    refreshAllSaldos();
    if(UI.currentPage === 'lancamentos') renderExpensesList();
    return payload;
  }

  form.addEventListener('submit', (ev)=>{
    ev.preventDefault();
    const saved = validateAndSave();
    if(!saved) return;
    closeModal();
    toast(existing ? 'Gasto atualizado' : 'Gasto adicionado');
    if(UI.currentPage !== 'lancamentos') renderPage(UI.currentPage);
  });

  const btnAnother = document.getElementById('btnSaveAddAnother');
  if(btnAnother){
    btnAnother.addEventListener('click', ()=>{
      const saved = validateAndSave();
      if(!saved) return;
      toast('Gasto adicionado — pronto para o próximo');
      // Reabre o modal já com os campos que costumam se repetir preenchidos
      // (categoria, forma de pagamento, cartão, data, responsável), só limpando
      // descrição e valor, pra agilizar vários lançamentos parecidos seguidos.
      openExpenseModal(null, {
        description: '', value: '',
        date: saved.date,
        categoryId: saved.categoryId,
        paymentMethod: saved.paymentMethod,
        cardId: saved.cardId,
        installments: 1,
        responsible: saved.responsible,
        note: ''
      });
    });
  }
}

/* ---------- Cartões de crédito ---------- */
function renderCartoes(){

    container.innerHTML = '<div class="empty-state">Nenhum cartão cadastrado ainda.</div>';

  container.innerHTML = cards.map(card => {
    const invoiceTotal = getCardInvoiceForMonth(card.id, year, month);
    const invoicePaid = getCardPaymentsForMonth(card.id, year, month);
    const invoiceOpen = Math.max(0, invoiceTotal - invoicePaid);
    const nextP = addMonths(year, month, 1);
    const nextInvoice = getCardInvoiceForMonth(card.id, nextP.year, nextP.month);
    const used = getCardUsage(card.id);
    const limit = Number(card.limit) || 0;
    const remaining = limit - used;
    const pct = limit > 0 ? clamp((used/limit)*100, 0, 100) : 0;
    const history = getCardInvoiceTimeline(card.id, 2, 4);
    const statusLabel = { paga:'Paga', parcial:'Parcial', aberto:'Em aberto', prevista:'Prevista', 'sem-gastos':'Sem gastos' };
    const statusClass = { paga:'status-paid', parcial:'status-partial', aberto:'status-open', prevista:'status-future', 'sem-gastos':'status-none' };
    const effectiveClosingDate = getEffectiveClosingDate(card, year, month);
    const closingIsOverridden = effectiveClosingDate.getDate() !== Number(card.closingDay) ||
      effectiveClosingDate.getMonth() !== month || effectiveClosingDate.getFullYear() !== year;
    const closingLabel = closingIsOverridden
      ? 'Fecha em ' + pad2(effectiveClosingDate.getDate()) + '/' + pad2(effectiveClosingDate.getMonth()+1) + '/' + effectiveClosingDate.getFullYear()
      : 'Fecha dia ' + effectiveClosingDate.getDate();

    return `
      <div class="credit-card-panel">
        <div class="credit-card-visual" style="background:linear-gradient(135deg, ${card.color||DEFAULT_CARD_COLOR}, ${shadeColor(card.color||DEFAULT_CARD_COLOR, -18)})">
          <div class="cc-top">
            <span>${escapeHTML(card.bank)}</span>
            ${icon('card')}
          </div>
          <div class="cc-name">${escapeHTML(card.name)}</div>
          <div class="cc-dates">
            ${closingLabel} · Vence dia ${card.dueDay}
            <button class="cc-adjust-closing" data-action="adjust-closing" data-id="${card.id}" title="Ajustar fechamento só da fatura de ${MONTH_NAMES[month]}/${year}">${icon('edit')}</button>
          </div>
        </div>
        <div class="cc-body">
          <button class="cc-row cc-row-clickable" data-action="view-invoice" data-id="${card.id}" data-year="${year}" data-month="${month}"><span>Fatura atual (${MONTH_SHORT[month]}/${year})</span><strong>${brl(invoiceTotal)} ${icon('chevronRight')}</strong></button>
          <div class="cc-row"><span>Já pago desta fatura</span><strong>${brl(invoicePaid)}</strong></div>
          <div class="cc-row"><span>Em aberto</span><strong style="color:${invoiceOpen>0?'var(--danger)':'var(--accent-dark)'}">${brl(invoiceOpen)}</strong></div>
          <div class="cc-row"><span>Próxima fatura (${MONTH_SHORT[nextP.month]}/${nextP.year})</span><strong>${brl(nextInvoice)}</strong></div>
          <div class="cc-limit">
            <div class="cc-limit-bar"><div class="cc-limit-fill" style="width:${pct}%; background:${pct>90?'var(--danger)':pct>70?'var(--warn)':(card.color||'var(--accent)')}"></div></div>
            <div class="cc-limit-labels"><span>Usado: ${brl(used)} de ${brl(limit)}</span><span>Disponível: ${remaining<0?'-':''}${brl(Math.abs(remaining))}</span></div>
          </div>
          <button class="btn-primary btn-block" data-action="pay-invoice" data-id="${card.id}" ${invoiceOpen<=0?'disabled':''}>${icon('wallet')} Pagar fatura</button>
          <div class="cc-actions">
            <button class="icon-btn" data-action="edit-card" data-id="${card.id}">${icon('edit')}</button>
            <button class="icon-btn danger" data-action="delete-card" data-id="${card.id}">${icon('trash')}</button>
          </div>
          <div class="invoice-history">
            <div class="invoice-history-title">Faturas — passadas e futuras (clique para ver os lançamentos)</div>
            ${history.map(h => `
              <button class="invoice-history-row invoice-history-row-btn ${h.isCurrent?'is-current':''}" data-action="view-invoice" data-id="${card.id}" data-year="${h.year}" data-month="${h.month}">
                <span>${MONTH_SHORT[h.month]}/${h.year}${h.isCurrent?' •':''}</span>
                <span class="tabular">${brl(h.total)}</span>
                <span class="invoice-status ${statusClass[h.status]}">${statusLabel[h.status]}</span>
              </button>`).join('')}
          </div>
        </div>
      </div>`;
  }).join('');

  container.querySelectorAll('[data-action="view-invoice"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const el = e.currentTarget;
      openInvoiceDetailModal(el.dataset.id, Number(el.dataset.year), Number(el.dataset.month));
    });
  });
  container.querySelectorAll('[data-action="adjust-closing"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      openCardClosingOverrideModal(e.currentTarget.dataset.id, year, month);
    });
  });
  container.querySelectorAll('[data-action="edit-card"]').forEach(btn=>{
    btn.addEventListener('click', e=> openCardModal(e.currentTarget.dataset.id));
  });
  container.querySelectorAll('[data-action="delete-card"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      confirmAction('Excluir cartão?', 'Os lançamentos vinculados permanecerão, mas ficarão sem cartão associado.', ()=>{
        Store.setCards(Store.getCards().filter(c=>c.id!==id));
        const exps = Store.getExpenses().map(x => x.cardId===id ? {...x, cardId:''} : x);
        Store.setExpenses(exps);
        Store.setCardPayments(Store.getCardPayments().filter(p=>p.cardId!==id));
        renderCartoes();
        refreshAllSaldos();
        toast('Cartão excluído');
      });
    });
  });
  container.querySelectorAll('[data-action="pay-invoice"]').forEach(btn=>{
    btn.addEventListener('click', e=> openCardPaymentModal(e.currentTarget.dataset.id, year, month));
  });
}

// Modal de pagamento de fatura: total ou parcial, com origem PIX ou Dinheiro.
// Reduz o saldo correspondente, abate o valor em aberto da fatura e restaura o limite do cartão.
// Mostra, item a item, tudo que compõe a fatura de um cartão num mês —
// data, descrição, valor e parcela (quando houver) — para conferência antes do pagamento.
// Ajusta o dia de fechamento de UM cartão só no mês selecionado (ex: fevereiro
// com 28 dias, ou o banco excepcionalmente mudou a virada naquele mês) — nunca
// altera o padrão cadastrado no cartão nem os outros meses.
function openCardClosingOverrideModal(cardId, year, month){
  const card = getCardById(cardId);
  if(!card) return;
  const overrides = Store.getCardClosingOverrides();
  const key = card.id + '_' + ymKey(year, month);
  const hasOverride = overrides[key] !== undefined && overrides[key] !== null && overrides[key] !== '';
  const currentDate = getEffectiveClosingDate(card, year, month);
  const currentISO = currentDate.getFullYear()+'-'+pad2(currentDate.getMonth()+1)+'-'+pad2(currentDate.getDate());

  const html = `
    <form id="closingOverrideForm" class="modal-form">
      <h2>Fechamento da fatura de ${escapeHTML(card.name)}</h2>
      <p class="confirm-sub">Fatura de ${MONTH_NAMES[month]} de ${year} — a data pode ser de qualquer mês (inclusive o anterior). O padrão cadastrado (dia ${card.closingDay}) continua valendo para as outras faturas.</p>
      <div class="form-grid">
        <label class="span-2">
          <span>Data de fechamento desta fatura</span>
          <input type="date" name="closingDate" required value="${currentISO}">
        </label>
      </div>
      <div class="modal-actions">
        ${hasOverride ? `<button type="button" class="btn-ghost" id="btnRestoreDefaultClosing">Restaurar padrão</button>` : `<span></span>`}
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>`;
  openModal(html);
  const form = document.getElementById('closingOverrideForm');

  form.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const dateStr = fd.get('closingDate');
    if(!dateStr){ toast('Informe uma data válida.'); return; }
    const ov = Store.getCardClosingOverrides();
    ov[key] = dateStr;
    Store.setCardClosingOverrides(ov);
    closeModal();
    toast('Fechamento desta fatura atualizado');
    renderCartoes();
  });

  const btnRestore = document.getElementById('btnRestoreDefaultClosing');
  if(btnRestore){
    btnRestore.addEventListener('click', ()=>{
      const ov = Store.getCardClosingOverrides();
      delete ov[key];
      Store.setCardClosingOverrides(ov);
      closeModal();
      toast('Fechamento padrão restaurado');
      renderCartoes();
    });
  }
}

function openCardPaymentModal(cardId, year, month){
  const card = getCardById(cardId);
  if(!card) return;
  const invoiceTotal = getCardInvoiceForMonth(cardId, year, month);
  const alreadyPaid = getCardPaymentsForMonth(cardId, year, month);
  const openAmount = Math.max(0, invoiceTotal - alreadyPaid);
  if(openAmount <= 0){
    toast('Esta fatura já está paga.');
    return;
  }
  const html = `
    <form id="cardPayForm" class="modal-form">
      <h2><span class="invoice-modal-dot" style="background:${card.color||DEFAULT_CARD_COLOR}"></span>Pagar fatura — ${escapeHTML(card.name)}</h2>
      <p class="confirm-sub">${MONTH_SHORT[month]}/${year} · Em aberto: <strong>${brl(openAmount)}</strong></p>
      <div class="form-grid">
        <label class="span-2">
          <span>Tipo de pagamento</span>
          <select name="type" id="cardPayType" required>
            <option value="total">Pagamento total (${brl(openAmount)})</option>
            <option value="parcial">Pagamento parcial</option>
          </select>
        </label>
        <label class="span-2" id="cardPayValueWrap" style="display:none;">
          <span>Valor a pagar (R$)</span>
          <input type="text" inputmode="decimal" name="value" placeholder="0,00">
        </label>
        <label class="span-2">
          <span>Origem do pagamento</span>
          <select name="source" required>
            <option value="pix">PIX / Conta (saldo: ${brl(getSaldoPix())})</option>
            <option value="dinheiro">Dinheiro em espécie (saldo: ${brl(getSaldoDinheiro())})</option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="close-modal">Cancelar</button>
        <button type="submit" class="btn-primary">Confirmar pagamento</button>
      </div>
    </form>`;
  openModal(html);
  const form = document.getElementById('cardPayForm');
  const typeSel = document.getElementById('cardPayType');
  const valueWrap = document.getElementById('cardPayValueWrap');
  function toggleValueField(){ valueWrap.style.display = typeSel.value === 'parcial' ? '' : 'none'; }
  typeSel.addEventListener('change', toggleValueField);
  toggleValueField();

  form.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const type = fd.get('type');
    let value;
    if(type === 'total'){
      value = openAmount;
    } else {
      value = parseCurrencyBR(fd.get('value'));
      if(isNaN(value) || value <= 0){
        toast('Informe um valor válido, ex: 800,00');
        return;
      }
      if(value > openAmount){
        toast('O valor não pode ser maior que o valor em aberto (' + brl(openAmount) + ').');
        return;
      }
    }
    const source = fd.get('source');
    const payments = Store.getCardPayments();
    payments.push({
      id: uid('cpay'),
      cardId, year, month,
      value,
      source,
      date: todayISO(),
      createdAt: Date.now()
    });
    Store.setCardPayments(payments);
    closeModal();
    toast('Pagamento registrado');
    renderCartoes();
    refreshAllSaldos();
  });
}

// Pergunta a forma de pagamento de um gasto fixo antes de marcá-lo como pago,
// e reflete o impacto correto no saldo (PIX/Dinheiro) ou na fatura do cartão.
function openFixedPaymentModal(fixedId, year, month, onDone){
  const fixed = Store.getFixed().find(f=>f.id===fixedId);
  if(!fixed){ if(onDone) onDone(); return; }
  const effectiveEntry = getFixedEntriesForMonth(year, month).find(e=>e.fixedId===fixedId);
  const effectiveValue = effectiveEntry ? effectiveEntry.value : (Number(fixed.expectedValue)||0);
  const cards = Store.getCards();
  const html = `
    <form id="fixedPayForm" class="modal-form">
      <h2>Confirmar pagamento</h2>
      <p class="confirm-sub">${escapeHTML(fixed.name)} — ${brl(effectiveValue)}</p>
      <div class="form-grid">
        <label class="span-2">
          <span>Qual foi a forma de pagamento?</span>
          <select name="method" id="fixedPayMethod" required>
            <option value="pix">PIX</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="credito">Cartão de crédito</option>
          </select>
        </label>
        <label class="span-2" id="fixedPayCardWrap">
          <span>Cartão utilizado</span>
          <select name="cardId">
            <option value="">Selecione um cartão</option>
            ${cards.map(c=>`<option value="${c.id}">${escapeHTML(c.name)} (${escapeHTML(c.bank)})</option>`).join('')}
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="btnCancelFixedPay">Cancelar</button>
        <button type="submit" class="btn-primary">Confirmar pagamento</button>
      </div>
    </form>`;
  openModal(html);
  const form = document.getElementById('fixedPayForm');
  const methodSel = document.getElementById('fixedPayMethod');
  const cardWrap = document.getElementById('fixedPayCardWrap');
  function toggleCardField(){ cardWrap.style.display = methodSel.value === 'credito' ? '' : 'none'; }
  methodSel.addEventListener('change', toggleCardField);
  toggleCardField();

  document.getElementById('btnCancelFixedPay').addEventListener('click', ()=>{
    closeModal();
    if(onDone) onDone();
  });

  form.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const method = fd.get('method');
    if(method === 'credito' && cards.length === 0){
      toast('Cadastre um cartão antes de pagar no crédito.');
      return;
    }
    if(method === 'credito' && !fd.get('cardId')){
      toast('Selecione o cartão utilizado.');
      return;
    }
    const paymentsNow = Store.getFixedPayments();
    const key = fixedId + '_' + ymKey(year, month);
    paymentsNow[key] = {
      paid: true,
      method,
      cardId: method === 'credito' ? fd.get('cardId') : '',
      value: effectiveValue,
      fixedId, year, month,
      date: todayISO()
    };
    Store.setFixedPayments(paymentsNow);
    closeModal();
    toast('Pagamento confirmado');
    if(onDone) onDone();
  });
}

// Permite ajustar o valor de UM gasto fixo apenas no mês selecionado (ex: conta de
// água/luz que varia um pouco todo mês), sem alterar o valor padrão usado nos
// demais meses — mantém a praticidade de continuar tratando como "fixo".
function openFixedValueModal(fixedId, year, month){
  const fixed = Store.getFixed().find(f=>f.id===fixedId);
  if(!fixed) return;
  const overrides = Store.getFixedOverrides();
  const monthKey = fixedId + '_' + ymKey(year, month);
  const hasOverride = overrides[monthKey] !== undefined && overrides[monthKey] !== null;
  const currentValue = hasOverride ? overrides[monthKey] : fixed.expectedValue;

  const html = `
    <form id="fixedValueForm" class="modal-form">
      <h2>Valor de ${escapeHTML(fixed.name)}</h2>
      <p class="confirm-sub">${MONTH_NAMES[month]} de ${year} — o valor padrão (${brl(fixed.expectedValue)}) continua valendo para os outros meses.</p>
      <div class="form-grid">
        <label class="span-2">
          <span>Valor neste mês (R$)</span>
          <input type="text" inputmode="decimal" name="value" required value="${String(currentValue).replace('.', ',')}" placeholder="0,00">
        </label>
      </div>
      <div class="modal-actions">
        ${hasOverride ? `<button type="button" class="btn-ghost" id="btnRestoreDefaultValue">Restaurar valor padrão</button>` : `<span></span>`}
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>`;
  openModal(html);
  const form = document.getElementById('fixedValueForm');

  form.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const parsed = parseCurrencyBR(fd.get('value'));
    if(isNaN(parsed) || parsed <= 0){
      toast('Informe um valor válido, ex: 85,00');
      return;
    }
    const ov = Store.getFixedOverrides();
    ov[monthKey] = parsed;
    Store.setFixedOverrides(ov);
    closeModal();
    toast('Valor deste mês atualizado');
    renderFixedList();
  });

  const btnRestore = document.getElementById('btnRestoreDefaultValue');
  if(btnRestore){
    btnRestore.addEventListener('click', ()=>{
      const ov = Store.getFixedOverrides();
      delete ov[monthKey];
      Store.setFixedOverrides(ov);
      closeModal();
      toast('Valor padrão restaurado');
      renderFixedList();
    });
  }
}

function frequencyLabel(f){
  return f==='anual' ? 'Anual' : 'Mensal';
}

function openFixedModal(id){
  const existing = id ? Store.getFixed().find(f=>f.id===id) : null;
  const categories = Store.getCategories();
  if(categories.length===0){ toast('Cadastre uma categoria antes.'); return; }
  const html = `
    <form id="fixedForm" class="modal-form">
      <h2>${existing?'Editar gasto fixo':'Novo gasto fixo'}</h2>
      <div class="form-grid">

        ${existing ? '' : `<label><span>Valor esperado (R$)</span><input type="text" inputmode="decimal" name="expectedValue" required placeholder="0,00"></label>`}
        <label><span>Dia de pagamento</span><input type="number" name="payDay" min="1" max="31" required value="${existing?existing.payDay:''}"></label>
        <label><span>Frequência</span><select name="frequency"><option value="mensal" ${existing&&existing.frequency==='mensal'?'selected':''}>Mensal</option><option value="anual" ${existing&&existing.frequency==='anual'?'selected':''}>Anual</option></select></label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="close-modal">Cancelar</button>
        <button type="submit" class="btn-primary">${existing?'Salvar':'Adicionar'}</button>
      </div>
    </form>`;
  openModal(html);
  document.getElementById('fixedForm').addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(ev.target);
    let expectedValue = existing ? existing.expectedValue : 0;
    if(!existing){
      const parsedExpected = parseCurrencyBR(fd.get('expectedValue'));
      if(isNaN(parsedExpected) || parsedExpected <= 0){
        toast('Informe um valor válido, ex: 120,00');
        return;
      }
      expectedValue = parsedExpected;
    }
    const payload = {
      id: existing?existing.id:uid('fixed'),
      name: fd.get('name').trim(),
      categoryId: fd.get('categoryId'),
      expectedValue: expectedValue,
      payDay: clamp(parseInt(fd.get('payDay'),10),1,31),
      frequency: fd.get('frequency')
    };
    const list = Store.getFixed();
    if(existing) list[list.findIndex(x=>x.id===existing.id)] = payload;
    else list.push(payload);
    Store.setFixed(list);
    closeModal();
    toast(existing?'Gasto fixo atualizado':'Gasto fixo adicionado');
    renderFixedList();
  });
}

  const html = `

      <h2>Alterar valor padrão</h2>
      <p class="confirm-sub">${escapeHTML(fixed.name)} — isso muda o valor usado em <strong>todos os meses futuros</strong> que não tiverem um ajuste individual próprio. Meses já ajustados individualmente não são afetados.</p>
      <div class="form-grid">
        <label class="span-2">
          <span>Novo valor padrão (R$)</span>
          <input type="text" inputmode="decimal" name="value" required value="${String(fixed.expectedValue).replace('.', ',')}" placeholder="0,00">
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="close-modal">Cancelar</button>
        <button type="submit" class="btn-primary">Alterar valor padrão</button>
      </div>
    </form>`;
  openModal(html);
  document.getElementById('fixedDefaultValueForm').addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const parsed = parseCurrencyBR(fd.get('value'));
    if(isNaN(parsed) || parsed <= 0){
      toast('Informe um valor válido, ex: 120,00');
      return;
    }
    const list = Store.getFixed();

function renderIncomesList(){
  const container = document.getElementById('incomesList');
  if(!container) return;
  let list = [...Store.getIncomes()].sort((a,b)=> new Date(b.date) - new Date(a.date));
  const f = UI.incomeFilters;
  if(f.text){
    const t = f.text.toLowerCase();
    list = list.filter(i => i.description.toLowerCase().includes(t) || (i.note||'').toLowerCase().includes(t));
  }
  if(f.category) list = list.filter(i => i.category === f.category);
  if(f.responsible) list = list.filter(i => i.responsible === f.responsible);
  if(f.month){
    const [fy, fm] = f.month.split('-').map(Number);
    list = list.filter(i => {
      const d = parseISODate(i.date);
      return d.getFullYear() === fy && (d.getMonth()+1) === fm;
    });
  }

  if(list.length === 0){
    container.innerHTML = '<div class="empty-state">Nenhuma entrada encontrada. Registre seu primeiro recebimento.</div>';
    return;

  container.innerHTML = `<div class="table-list">` + list.map(i => `

        <span class="row-title">${escapeHTML(i.description)}</span>
        <span class="row-sub">${formatDateBR(i.date)} · ${i.method==='dinheiro'?'Dinheiro':'PIX/Conta'} · ${escapeHTML(getUserName(i.responsible))}${i.note?' · '+escapeHTML(i.note):''}</span>
      </div>
      <div class="col-value income-value">+ ${brl(i.value)}</div>
      <div class="col-actions">
        <button class="icon-btn" data-action="edit-income" title="Editar">${icon('edit')}</button>
        <button class="icon-btn danger" data-action="delete-income" title="Excluir">${icon('trash')}</button>
      </div>
    </div>`).join('') + `</div>`;

  container.querySelectorAll('[data-action="edit-income"]').forEach(btn=>{
    btn.addEventListener('click', e=> openIncomeModal(e.target.closest('.table-row').dataset.id));
  });

function renderInvestmentTypeChart(year, month, canvasId, legendId, chartKey){
  canvasId = canvasId || 'chartInvestimentoTipo';
  legendId = legendId || 'investimentoTipoLegend';
  chartKey = chartKey || 'investmentPie';
  const ctx = document.getElementById(canvasId);
  const legendEl = document.getElementById(legendId);
  if(!ctx) return;
  const byType = getInvestmentTotalsByType(year, month);
  const labels = [];
  const data = [];
  const colors = [];
  INVESTMENT_TYPES.forEach((t, idx) => {
    const v = byType[t];
    if(v && v > 0){
      labels.push(t);
      data.push(Number(v.toFixed(2)));
      colors.push(CHART_PALETTE[idx % CHART_PALETTE.length]);
    }
  });
  if(UI.charts[chartKey]) UI.charts[chartKey].destroy();
  if(data.length === 0){
    ctx.parentElement.innerHTML = '<div class="empty-chart">Nenhum investimento registrado até este mês.</div>';
    if(legendEl) legendEl.innerHTML = '';
    return;
  }
  if(legendEl){
    const total = data.reduce((s,v)=>s+v,0);
    const items = labels.map((name,i)=>({name, value:data[i], color:colors[i]})).sort((a,b)=>b.value-a.value);
    legendEl.innerHTML = items.map(it=>{
      const pct = total>0 ? (it.value/total)*100 : 0;
      return `<div class="pie-legend-item">
        <span class="pie-legend-dot" style="background:${it.color}"></span>
        <span class="pie-legend-name">${escapeHTML(it.name)}</span>
        <span class="pie-legend-pct">${pct.toFixed(1).replace('.', ',')}%</span>
        <span class="pie-legend-value">${brl(it.value)}</span>
      </div>`;
    }).join('');
  }
  if(typeof Chart === 'undefined'){
    ctx.parentElement.innerHTML = '<div class="empty-chart">Gráfico indisponível (sem conexão com a internet).</div>';
    return;
  }
  UI.charts[chartKey] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ display:false } } }
  });
}

function renderInvestmentsList(){
  const container = document.getElementById('investmentsList');
  if(!container) return;
  let list = [...Store.getInvestments()].sort((a,b)=> new Date(b.date) - new Date(a.date));
  const f = UI.investmentFilters;
  if(f.text){
    const t = f.text.toLowerCase();
    list = list.filter(i => i.description.toLowerCase().includes(t) || (i.note||'').toLowerCase().includes(t));
  }
  if(f.type) list = list.filter(i => i.type === f.type);
  if(f.responsible) list = list.filter(i => i.responsible === f.responsible);
  if(f.month){
    const [fy, fm] = f.month.split('-').map(Number);
    list = list.filter(i => {
      const d = parseISODate(i.date);
      return d.getFullYear() === fy && (d.getMonth()+1) === fm;
    });

// Resgata total ou parcialmente um investimento: reduz o saldo do investimento
// (via registro de resgate, mantendo o histórico) e devolve o valor para o
// saldo da conta escolhida (PIX ou Dinheiro).
function openInvestmentRedeemModal(investmentId){
  const investment = Store.getInvestments().find(i=>i.id===investmentId);
  if(!investment) return;
  const { year, month } = UI.selected;
  const balance = getInvestmentCurrentBalance(investment, year, month);
  if(balance <= 0){
    toast('Este investimento não tem saldo disponível para resgate.');
    return;
  }

  const html = `
    <form id="redeemForm" class="modal-form">
      <h2>Resgatar — ${escapeHTML(investment.description)}</h2>
      <p class="confirm-sub">Saldo disponível: <strong>${brl(balance)}</strong></p>
      <div class="form-grid">
        <label class="span-2">
          <span>Tipo de resgate</span>
          <select name="type" id="redeemType" required>
            <option value="total">Resgate total (${brl(balance)})</option>
            <option value="parcial">Resgate parcial</option>
          </select>
        </label>
        <label class="span-2" id="redeemValueWrap" style="display:none;">
          <span>Valor a resgatar (R$)</span>
          <input type="text" inputmode="decimal" name="value" placeholder="0,00">
        </label>
        <label class="span-2">
          <span>Devolver o valor para</span>
          <select name="destination" required>
            <option value="pix">PIX / Conta (saldo: ${brl(getSaldoPix())})</option>
            <option value="dinheiro">Dinheiro em espécie (saldo: ${brl(getSaldoDinheiro())})</option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="close-modal">Cancelar</button>
        <button type="submit" class="btn-primary">Confirmar resgate</button>
      </div>
    </form>`;
  openModal(html);
  const form = document.getElementById('redeemForm');
  const typeSel = document.getElementById('redeemType');
  const valueWrap = document.getElementById('redeemValueWrap');
  function toggleValueField(){ valueWrap.style.display = typeSel.value === 'parcial' ? '' : 'none'; }
  typeSel.addEventListener('change', toggleValueField);
  toggleValueField();

  form.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const type = fd.get('type');
    let value;
    if(type === 'total'){
      value = balance;
    } else {
      value = parseCurrencyBR(fd.get('value'));
      if(isNaN(value) || value <= 0){
        toast('Informe um valor válido, ex: 200,00');
        return;
      }
      if(value > balance){
        toast('O valor não pode ser maior que o saldo disponível (' + brl(balance) + ').');
        return;
      }
    }
    const destination = fd.get('destination');
    const redemptions = Store.getInvestmentRedemptions();
    redemptions.push({
      id: uid('redeem'),
      investmentId,
      date: todayISO(),
      value,
      destination,
      note: '',
      createdAt: Date.now()
    });
    Store.setInvestmentRedemptions(redemptions);
    closeModal();
    toast('Resgate registrado');
    renderInvestmentsList();
    refreshAllSaldos();
  });
}

function renderGoalsGrid(){
  const grid = document.getElementById('goalsGrid');
  const categories = Store.getCategories();
  const goals = Store.getGoals();
  const { year, month } = UI.selected;
  const totals = getCategoryTotalsForMonth(year, month);

  if(categories.length===0){
    grid.innerHTML = '<div class="empty-state">Cadastre categorias primeiro.</div>';
    return;
  }

  grid.innerHTML = categories.map(cat => {
    const goal = goals.find(g=>g.categoryId===cat.id);
    const spent = totals[cat.id] || 0;
    const limit = goal ? Number(goal.monthlyLimit) : 0;
    const pct = limit>0 ? clamp((spent/limit)*100,0,999) : 0;
    const over = limit>0 && spent > limit;
    return `
      <div class="goal-card ${over?'over':''}">
        <div class="goal-head">
          <span class="goal-dot" style="background:${cat.color}"></span>
          <span class="goal-name">${escapeHTML(cat.name)}</span>
          <button class="icon-btn" data-action="set-goal" data-id="${cat.id}">${icon('edit')}</button>
        </div>
        ${limit>0 ? `
          <div class="goal-bar"><div class="goal-bar-fill" style="width:${clamp(pct,0,100)}%; background:${over?'var(--danger)':pct>80?'var(--warn)':'var(--accent)'}"></div></div>
          <div class="goal-numbers">
            <span>${brl(spent)} de ${brl(limit)}</span>
            <span class="${over?'text-danger':''}">${pct.toFixed(0)}%</span>
          </div>
          ${over ? `<div class="goal-alert">⚠ Meta ultrapassada em ${brl(spent-limit)}</div>` : `<div class="goal-remaining">Falta ${brl(Math.max(0,limit-spent))}</div>`}
        ` : `<div class="goal-empty">Nenhuma meta definida. <button class="link-btn" data-action="set-goal" data-id="${cat.id}">Definir meta</button></div>`}
      </div>`;
  }).join('');

function openGoalModal(categoryId){
  const cat = getCategoryById(categoryId);
  const existing = Store.getGoals().find(g=>g.categoryId===categoryId);
  const html = `
    <form id="goalForm" class="modal-form">
      <h2>Meta para ${escapeHTML(cat.name)}</h2>
      <div class="form-grid">
        <label class="span-2"><span>Meta mensal (R$)</span><input type="text" inputmode="decimal" name="monthlyLimit" required value="${existing?String(existing.monthlyLimit).replace('.', ','):''}" placeholder="0,00"></label>
      </div>
      <div class="modal-actions">
        ${existing?'<button type="button" class="btn-ghost" data-action="remove-goal">Remover meta</button>':'<span></span>'}
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>`;
  openModal(html);
  const form = document.getElementById('goalForm');
  form.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const parsedGoal = parseCurrencyBR(fd.get('monthlyLimit'));
    if(isNaN(parsedGoal) || parsedGoal <= 0){
      toast('Informe uma meta válida, ex: 800,00');
      return;
    }
    const payload = { id: existing?existing.id:uid('goal'), categoryId, monthlyLimit: parsedGoal };
    const list = Store.getGoals();
    if(existing) list[list.findIndex(x=>x.id===existing.id)] = payload;
    else list.push(payload);
    Store.setGoals(list);
    closeModal();
    toast('Meta salva');
    renderGoalsGrid();
  });
  const removeBtn = form.querySelector('[data-action="remove-goal"]');
  if(removeBtn){
    removeBtn.addEventListener('click', ()=>{
      Store.setGoals(Store.getGoals().filter(g=>g.categoryId!==categoryId));
      closeModal();
      toast('Meta removida');
      renderGoalsGrid();
    });
  }
}

/* ---------- Configurações · Nuvem (sincronização com Google Drive) ---------- */
function formatSyncTime(ts){
  if(!ts) return 'nunca';
  const d = new Date(Number(ts));
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const time = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  return sameDay ? `hoje às ${time}` : `${formatDateBR(d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()))} às ${time}`;
}

  'idle': 'Sincronizado',

  'not-configured': 'Não configurado'
};
const CLOUD_STATUS_CLASS = {

};

// Atualiza só o miolo do status (chamado pelos listeners globais do CloudSync/GoogleAuth
// e também logo após renderNuvem() desenhar a página). Não faz nada se a página não
// estiver visível no momento — evita erro de elemento inexistente.
function updateCloudStatusUI(){
  const box = document.getElementById('nuvemStatusBox');
  if(!box) return;
  const connected = GoogleAuth.isSignedIn();
  const status = connected ? CloudSync.status : (GoogleAuth.wasConnected() ? 'syncing' : 'idle');
  box.innerHTML = connected ? `
    <div class="cc-row"><span>Status</span><strong><span class="invoice-status ${CLOUD_STATUS_CLASS[CloudSync.status]||'status-none'}">${CLOUD_STATUS_LABEL[CloudSync.status]||CloudSync.status}</span></strong></div>
    <div class="cc-row"><span>Última sincronização</span><strong>${formatSyncTime(CloudSync.lastSyncedAt)}</strong></div>
    ${CloudSync.status==='error' ? `<div class="goal-alert">⚠ ${escapeHTML(CloudSync.lastError||'Falha ao sincronizar.')}</div>` : ''}
  ` : `<p class="config-desc" style="margin:0;">Ainda não conectado.</p>`;

  const btnSync = document.getElementById('btnSyncNow');
  if(btnSync) btnSync.disabled = !connected || CloudSync.status === 'syncing';
}

function openUserModal(id){
  const existing = id ? Store.getUsers().find(u=>u.id===id) : null;
  const html = `
    <form id="userForm" class="modal-form">
      <h2>${existing?'Editar usuário':'Novo usuário'}</h2>
      <div class="form-grid">
        <label class="span-2">
          <span>Nome</span>
          <input type="text" name="name" required maxlength="40" value="${existing?escapeHTML(existing.name):''}" placeholder="Ex: Ana, Pedro, Carlos...">
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="close-modal">Cancelar</button>
        <button type="submit" class="btn-primary">${existing?'Salvar alterações':'Adicionar usuário'}</button>
      </div>
    </form>`;
  openModal(html);
  const form = document.getElementById('userForm');
  form.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const name = fd.get('name').trim();
    if(!name){
      toast('Informe um nome.');
      return;
    }
    const users = Store.getUsers();
    const isDuplicate = users.some(u => u.name.toLowerCase() === name.toLowerCase() && (!existing || u.id !== existing.id));
    if(isDuplicate){
      toast('Já existe um usuário com esse nome.');
      return;
    }
    if(existing){
      const idx = users.findIndex(u=>u.id===existing.id);
      users[idx] = { ...existing, name };
    } else {
      users.push({ id: uid('user'), name });
    }
    Store.setUsers(users);
    closeModal();
    toast(existing?'Usuário atualizado':'Usuário adicionado');
    renderUsersList();
    refreshAllSaldos();
  });
}

// Exclusão de usuário: se ele não estiver associado a nenhum registro, confirma e apaga
// direto. Se estiver, oferece transferir os registros para outro usuário (ou deixar sem
// responsável) antes de excluir — nunca apaga silenciosamente dados de outros módulos.
function openDeleteUserModal(userId){
  const user = getUserById(userId);
  if(!user) return;
  const usageCount = countUserUsage(userId);

  if(usageCount === 0){
    confirmAction('Excluir usuário?', `"${user.name}" será removido permanentemente. Ele não está associado a nenhum registro.`, ()=>{
      Store.setUsers(Store.getUsers().filter(u=>u.id!==userId));
      renderUsersList();
      refreshAllSaldos();
      toast('Usuário excluído');
    });
    return;
  }

  const otherUsers = Store.getUsers().filter(u=>u.id!==userId);
  const html = `
    <div class="modal-form confirm-box">
      <h2>Excluir "${escapeHTML(user.name)}"</h2>
      <p>Esse usuário está associado a <strong>${usageCount} registro${usageCount===1?'':'s'}</strong> (gastos, entradas ou investimentos). Escolha o que fazer com eles antes de excluir.</p>
      <div class="form-grid" style="margin-top:14px;">
        <label class="span-2">
          <span>Transferir esses registros para</span>
          <select id="transferTargetUser">
            <option value="">Deixar sem responsável</option>
            ${otherUsers.map(u=>`<option value="${u.id}">${escapeHTML(u.name)}</option>`).join('')}
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="close-modal">Cancelar</button>
        <button type="button" class="btn-danger" id="btnConfirmTransferDelete">Excluir usuário</button>
      </div>
    </div>`;
  openModal(html);
  document.getElementById('btnConfirmTransferDelete').addEventListener('click', ()=>{
    const targetId = document.getElementById('transferTargetUser').value || '';
    Store.setExpenses(Store.getExpenses().map(e => e.responsible===userId ? { ...e, responsible: targetId } : e));
    Store.setIncomes(Store.getIncomes().map(i => i.responsible===userId ? { ...i, responsible: targetId } : i));
    Store.setInvestments(Store.getInvestments().map(i => i.responsible===userId ? { ...i, responsible: targetId } : i));
    Store.setUsers(Store.getUsers().filter(u=>u.id!==userId));
    closeModal();
    renderUsersList();
    refreshAllSaldos();
    toast(targetId ? 'Usuário excluído e registros transferidos' : 'Usuário excluído');
  });
}

/* ---------- Modal genérico ---------- */
function openModal(html){
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalContent').innerHTML = html;
  overlay.classList.add('active');
  overlay.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.addEventListener('click', closeModal));
  document.body.classList.add('modal-open');
}
function closeModal(){
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('active');
  document.getElementById('modalContent').innerHTML = '';
  document.body.classList.remove('modal-open');
}

/* ---------- Confirmação de exclusão ---------- */
function confirmAction(title, message, onConfirm){
  const html = `
    <div class="modal-form confirm-box">
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(message)}</p>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-action="close-modal">Cancelar</button>
        <button type="button" class="btn-danger" id="btnConfirmYes">Confirmar</button>
      </div>
    </div>`;
  openModal(html);
  document.getElementById('btnConfirmYes').addEventListener('click', ()=>{
    closeModal();
    onConfirm();
  });
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(message){
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2600);
}

  });
  document.getElementById('btnMenuToggle').addEventListener('click', ()=>{
    document.body.classList.toggle('nav-open');
  });
  document.getElementById('navOverlay').addEventListener('click', closeMobileNav);
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closeModal();
  });
}

function init(){
  seedIfNeeded();
  migrateLegacyResponsibleNames();
  initNav();
  initCloudSync();
  navigateTo('dashboard');
}

// Prepara o módulo de nuvem e registra os listeners globais (uma única vez) que
// mantêm o status na tela de Configurações → Nuvem sempre atualizado, mesmo que
// a sincronização aconteça em segundo plano enquanto o usuário está em outra página.
function initCloudSync(){
  CloudSync.init();
  GoogleAuth.onChange(()=> updateCloudStatusUI());
  CloudSync.onChange(()=> updateCloudStatusUI());

  const tryInit = ()=>{
    if(!GoogleAuth.isConfigured()) return;
    const ok = GoogleAuth.init();
    // Se o usuário já tinha conectado antes neste navegador, tenta retomar a
    // sessão silenciosamente (sem abrir popup) assim que o Google carregar.
    if(ok && GoogleAuth.wasConnected()){
      GoogleAuth.getToken().catch(()=>{ /* precisa reconectar manualmente */ });
    }
  };

  if(GoogleAuth.isGisAvailable()) tryInit();
  else window.__gisLoaded = tryInit; // chamado pelo onload do <script> do Google
}

document.addEventListener('DOMContentLoaded', init);

</script>
