<style>
/* =========================================================
   Vortex Finance v0.5 — estilos
   ========================================================= */

:root{
  --bg-app: #F3F6F8;
  --bg-sidebar: #0E1B23;
  --bg-sidebar-hover: rgba(255,255,255,0.06);
  --sidebar-text: #93A5AD;
  --sidebar-text-active: #FFFFFF;
  --accent: #12B886;
  --accent-dark: #0B8F68;
  --accent-soft: #E3F8F0;
  --warn: #F5A623;
  --warn-soft: #FFF4E0;
  --danger: #E5484D;
  --danger-soft: #FDECEC;
  --ink: #16222B;
  --muted: #66788A;
  --border: #E2E8ED;
  --card-bg: #FFFFFF;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(16,24,32,0.04), 0 1px 1px rgba(16,24,32,0.03);
  --shadow-md: 0 8px 24px rgba(16,24,32,0.08);
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

*, *::before, *::after{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin:0;
  font-family: var(--font-body);
  background: var(--bg-app);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4{ font-family: var(--font-display); margin:0; letter-spacing:-0.02em; }
p{ margin:0; }
button{ font-family: inherit; cursor:pointer; }
input, select, textarea{ font-family: inherit; }
a{ color: inherit; }
::selection{ background: var(--accent-soft); }

.tabular{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stat-value, .entry-value, .col-value, .cc-row strong, .preview-item strong,
.goal-numbers, .cat-bar-value, .row-title + .row-sub, .table-row .col-value{
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* ---------- App shell ---------- */
.app-shell{
  display:flex;
  min-height:100vh;
}

/* Sidebar */
.sidebar{
  width: 264px;
  flex-shrink:0;
  background: var(--bg-sidebar);
  color: var(--sidebar-text);
  display:flex;
  flex-direction:column;
  padding: 24px 16px;
  position: sticky;
  top:0;
  height:100vh;
  z-index: 40;
}
.sidebar-nav{
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding-right: 2px;
  margin-right: -2px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.18) transparent;
}
.sidebar-nav::-webkit-scrollbar{ width:6px; }
.sidebar-nav::-webkit-scrollbar-track{ background:transparent; }
.sidebar-nav::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.18); border-radius:10px; }
.sidebar-nav::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,0.3); }
.sidebar-brand{
  display:flex;
  flex-direction: column;
  align-items:center;
  text-align:center;
  gap:2px;
  padding: 10px 10px 26px;
  color:#fff;
}
.sidebar-brand .brand-mark-badge{
  width:68px; height:68px;
  border-radius:16px;
  background: #F7F6F3;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  margin-bottom:10px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}
.sidebar-brand .brand-mark-badge img{
  display:block;
  width:48px; height:48px;
  object-fit: contain;
}
.sidebar-brand .brand-name{
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
}
.sidebar-brand .brand-sub{
  display:block;
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--sidebar-text);
  font-weight: 400;
  margin-top:1px;
}

.nav-section-label{
  font-size:11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #5C6E78;
  padding: 14px 12px 6px;
}

.nav-item{
  display:flex; align-items:center; gap:12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  color: var(--sidebar-text);
  cursor:pointer;
  transition: background .15s ease, color .15s ease;
  position: relative;
  margin-bottom: 2px;
}
.nav-item svg{ flex-shrink:0; opacity:0.85; }
.nav-item:hover{ background: var(--bg-sidebar-hover); color:#fff; }
.nav-item.active{
  background: rgba(18,184,134,0.14);
  color: #fff;
}
.nav-item.active::before{
  content:'';
  position:absolute; left:-16px; top:8px; bottom:8px; width:3px;
  background: var(--accent);
  border-radius: 4px;
}
.nav-item.active svg{ opacity:1; color: var(--accent); }

.sidebar-footer{
  margin-top:auto;
  padding: 14px 12px;
  font-size:11px;
  color:#4E606A;
  border-top: 1px solid rgba(255,255,255,0.06);
}

/* Main area */
.main-area{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.topbar{
  display:none;
  align-items:center;
  gap:12px;
  padding: 14px 20px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  position: sticky; top:0; z-index:30;
}
.topbar h2{ font-size:16px; }
.content{
  flex:1;
  padding: 32px 40px 60px;
  max-width: 1280px;
  width:100%;
  margin: 0 auto;
}

.page{ display:none; animation: fadeIn .25s ease; }
.page.active{ display:block; }
@keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

.page-header{
  display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
  flex-wrap:wrap;
  margin-bottom: 28px;
}
.page-header h1{ font-size: 26px; font-weight:600; }
.page-header .subtitle{ color: var(--muted); font-size: 14px; margin-top:4px; }
.header-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

/* Buttons */
.btn-primary{
  display:inline-flex; align-items:center; gap:8px;
  background: var(--ink);
  color:#fff;
  border:none;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  font-weight:600;
  font-size:14px;
  transition: transform .12s ease, background .15s ease;
  white-space: nowrap;
}
.btn-primary:hover{ background:#000; transform: translateY(-1px); }
.btn-primary svg{ flex-shrink:0; }

.btn-ghost{
  background: transparent;
  border: 1px solid var(--border);
  color: var(--ink);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size:14px;
  font-weight:500;
}
.btn-ghost:hover{ background:#F3F5F7; }

.btn-danger{
  background: var(--danger);
  color:#fff;
  border:none;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight:600;
  font-size:14px;
}
.btn-danger:hover{ background:#CC3339; }

.icon-btn{
  width:34px; height:34px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: #fff;
  color: var(--muted);
  transition: all .15s ease;
}
.icon-btn:hover{ background:#F3F5F7; color: var(--ink); }
.icon-btn.danger:hover{ background: var(--danger-soft); color: var(--danger); border-color:#F5C2C4; }

.link-btn{
  background:none; border:none; color: var(--accent-dark); font-weight:600; font-size:13px; padding:0; text-decoration: underline;
}

/* Month switch */
.month-switch{
  display:flex; align-items:center; gap:10px;
  background:#fff; border:1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
}
.month-label{ font-weight:600; font-size:14px; min-width:130px; text-align:center; }
.month-label-btn{
  background:none; border:none; font-family:inherit; cursor:pointer;
  border-radius: var(--radius-sm); padding:6px 4px;
}
.month-label-btn:hover{ background:#F3F5F7; }
.month-picker-modal{ max-width:340px; }
.month-picker-year-nav{
  display:flex; align-items:center; justify-content:center; gap:18px;
  margin-bottom:16px;
}
.month-picker-year-label{ font-family: var(--font-display); font-size:18px; font-weight:700; min-width:60px; text-align:center; }
.month-picker-grid{
  display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;
  margin-bottom: 4px;
}
.month-picker-cell{
  padding:12px 6px; border:1px solid var(--border); border-radius: var(--radius-sm);
  background:#fff; font-family:inherit; font-size:13.5px; font-weight:600;
  color: var(--ink); cursor:pointer; transition: all .12s ease;
}
.month-picker-cell:hover{ border-color: var(--accent); background: var(--accent-soft); }
.month-picker-cell.is-selected{ background: var(--ink); border-color: var(--ink); color:#fff; }
.month-picker-cell.is-today:not(.is-selected){ border-color: var(--accent); color: var(--accent-dark); }
.month-label span{ color: var(--muted); font-weight:500; }

/* Stat cards */
.cards-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 24px;
}
.stat-card{
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  display:flex; align-items:flex-start; gap:14px;
  box-shadow: var(--shadow-sm);
}
.stat-icon{
  width:44px; height:44px; border-radius: 12px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.stat-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.stat-label{ font-size:12.5px; color: var(--muted); font-weight:500; }
.stat-value{ font-size:20px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-sub{ font-size:12px; color: var(--muted); }

/* Charts */
.charts-grid{
  display:grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 18px;
  margin-bottom: 24px;
}
.charts-grid-2{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}
.panel{
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.panel-header h3{ font-size:15px; font-weight:600; }
.chart-wrap{ height: 280px; position:relative; }
.empty-chart{ display:flex; align-items:center; justify-content:center; height:100%; color: var(--muted); font-size:13px; text-align:center; padding:0 16px; }

/* Por responsável (usuários cadastrados dinamicamente) */
.people-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 16px;
}
.person-card{
  border:1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  background:#FBFCFD;
}
.person-head{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
.person-dot{ width:11px; height:11px; border-radius:50%; }
.person-name{ font-weight:700; font-size:15px; }
.person-row{ display:flex; justify-content:space-between; font-size:13px; color: var(--muted); padding:5px 0; border-bottom:1px dashed var(--border); }
.person-row:last-child{ border-bottom:none; }
.person-row strong{ color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.income-value{ color: var(--accent-dark); }

.pie-panel-body{
  display:flex;
  align-items:stretch;
  gap: 22px;
}
.chart-wrap-pie{
  flex: 0 0 210px;
  height: 220px;
  width: 210px;
}
.pie-legend{
  flex: 1;
  min-width: 0;
  display:flex;
  flex-direction:column;
  gap: 2px;
  max-height: 240px;
  overflow-y: auto;
  padding-right: 4px;
}
.pie-legend-item{
  display:flex;
  align-items:center;
  gap: 10px;
  padding: 9px 4px;
  border-bottom: 1px solid var(--border);
}
.pie-legend-item:last-child{ border-bottom:none; }
.pie-legend-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.pie-legend-name{
  flex:1; min-width:0;
  font-size:13.5px; font-weight:600; color: var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pie-legend-pct{
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size:12.5px; font-weight:600; color: var(--muted);
  width: 50px; text-align:right; flex-shrink:0;
}
.pie-legend-value{
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size:13px; font-weight:700; color: var(--ink);
  width: 108px; text-align:right; flex-shrink:0;
}

@media (max-width: 640px){
  .pie-panel-body{ flex-direction:column; }
  .chart-wrap-pie{ width:100%; flex-basis:auto; align-self:center; }
  .pie-legend-value{ width:auto; }
}

/* Entry list (dashboard / mensal) */
.entry-list{ display:flex; flex-direction:column; }
.entry-row{
  display:flex; align-items:center; gap:12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border);
}
.entry-row:last-child{ border-bottom:none; }
.entry-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.entry-main{ display:flex; flex-direction:column; flex:1; min-width:0; gap:2px; }
.entry-desc{ font-size:14px; font-weight:600; }
.entry-meta{ font-size:12.5px; color: var(--muted); }
.entry-value{ font-weight:700; font-size:14px; white-space:nowrap; }
.badge{
  display:inline-block; font-size:11px; font-weight:600;
  background: var(--warn-soft); color:#B06A00;
  padding:1px 7px; border-radius:20px; margin-left:6px;
}
.badge.success{ background: var(--accent-soft); color: var(--accent-dark); }

.empty-state{
  padding: 36px 20px;
  text-align:center;
  color: var(--muted);
  font-size:14px;
}

/* Filters bar */
.filters-bar{
  display:flex; gap:10px; flex-wrap:wrap;
  margin-bottom: 18px;
}
.filters-bar select, .filters-bar input[type="month"]{
  border:1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size:13.5px; background:#fff; color: var(--ink);
}
.input-icon{
  position:relative; flex:1; min-width:220px;
}
.input-icon svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color: var(--muted); }
.input-icon input{
  width:100%; padding: 10px 12px 10px 36px;
  border:1px solid var(--border); border-radius: var(--radius-sm);
  font-size:13.5px;
}

/* Table list (lançamentos / fixos) */
.table-list{ display:flex; flex-direction:column; }
.table-row{
  display:flex; align-items:center; gap:14px;
  padding: 14px 6px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.table-row:last-child{ border-bottom:none; }
.col-tag{
  font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; flex-shrink:0;
  white-space:nowrap;
}
.col-main{ display:flex; flex-direction:column; gap:2px; flex:1; min-width:180px; }
.row-title{ font-size:14px; font-weight:600; }
.row-sub{ font-size:12.5px; color: var(--muted); }
.col-value{ font-weight:700; font-size:14.5px; white-space:nowrap; }
.fixed-value-btn{
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  background:none; border:1px dashed transparent; border-radius:6px;
  padding:4px 8px; cursor:pointer; display:flex; align-items:center; gap:6px;
  transition: border-color .15s ease, background .15s ease;
}
.fixed-value-btn:hover{ border-color: var(--border); background:#F7F9FA; }
.col-actions{ display:flex; gap:6px; flex-shrink:0; }
.paid-toggle{ display:flex; align-items:center; gap:6px; font-size:12.5px; color: var(--muted); cursor:pointer; flex-shrink:0; }
.paid-toggle input{ accent-color: var(--accent); width:16px; height:16px; }

/* Credit cards page */
.cards-columns{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
  gap: 20px;
}
.credit-card-panel{
  background: var(--card-bg);
  border:1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow:hidden;
  box-shadow: var(--shadow-sm);
}
.credit-card-visual{
  background: linear-gradient(135deg, #0E1B23, #163243);
  color:#fff;
  padding: 20px;
}
.cc-top{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; opacity:0.8; margin-bottom:22px; }
.cc-name{ font-family: var(--font-display); font-size:19px; font-weight:600; }
.cc-dates{ font-size:12px; opacity:0.75; margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.cc-adjust-closing{
  background: rgba(255,255,255,0.15); border:none; border-radius:5px;
  width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
  color:#fff; cursor:pointer; opacity:0.85; flex-shrink:0;
}
.cc-adjust-closing:hover{ opacity:1; background: rgba(255,255,255,0.28); }
.cc-adjust-closing svg{ width:11px; height:11px; }
.cc-body{ padding: 18px 20px 20px; }
.cc-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color: var(--muted); margin-bottom:8px; }
.cc-row strong{ color: var(--ink); font-size:14.5px; }
.cc-row-clickable{
  width:100%; background:none; border:none; padding:0; margin-bottom:8px;
  font-family:inherit; cursor:pointer; text-align:left; border-radius:6px;
}
.cc-row-clickable strong{ display:inline-flex; align-items:center; gap:2px; }
.cc-row-clickable:hover{ text-decoration: underline; }
.cc-row-clickable:hover strong{ color: var(--accent-dark); }
.cc-limit{ margin: 14px 0 6px; }
.cc-limit-bar{ height:8px; background:#EEF1F3; border-radius:10px; overflow:hidden; }
.cc-limit-fill{ height:100%; border-radius:10px; transition: width .3s ease; }
.cc-limit-labels{ display:flex; justify-content:space-between; font-size:11.5px; color: var(--muted); margin-top:6px; }
.cc-actions{ display:flex; justify-content:flex-end; gap:6px; margin-top:12px; }
.btn-block{ width:100%; justify-content:center; margin-top:14px; }
.btn-block:disabled{ opacity:0.45; cursor:not-allowed; }
.btn-block:disabled:hover{ background: var(--ink); transform:none; }

.invoice-history{ margin-top:16px; border-top:1px solid var(--border); padding-top:12px; }
.invoice-history-title{ font-size:11.5px; font-weight:700; color: var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
.invoice-history-row{
  display:grid; grid-template-columns: 60px 1fr auto; align-items:center; gap:10px;
  font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border);
}
.invoice-history-row:last-child{ border-bottom:none; }
.invoice-history-row-btn{
  width:100%; background:none; border:none; font-family:inherit; cursor:pointer;
  color: var(--ink); border-radius:6px;
}
.invoice-history-row-btn:hover{ background:#F7F9FA; }
.invoice-modal-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
.inline-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.invoice-detail-list{ max-height: 360px; overflow-y:auto; margin-top:12px; }
.invoice-status{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; justify-self:end; white-space:nowrap; }
.status-paid{ background: var(--accent-soft); color: var(--accent-dark); }
.status-partial{ background: var(--warn-soft); color:#B06A00; }
.status-open{ background: var(--danger-soft); color: var(--danger); }
.status-none{ background:#F1F3F5; color: var(--muted); }
.status-future{ background:#EEF1FF; color:#4C6EF5; }
.invoice-history-row.is-current{ background:#F7F9FA; margin:0 -8px; padding:6px 8px; border-radius:6px; border-bottom-color:transparent; }
.invoice-history-row.is-current span:first-child{ font-weight:700; color: var(--ink); }

/* Saldos disponíveis */
.saldos-panel{ background: linear-gradient(135deg, #0E1B23, #16323f); }
.saldos-panel .panel-header h3{ color:#fff; }
.saldos-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
  gap: 14px;
}
.saldo-item{
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display:flex; flex-direction:column; gap:6px;
}
.saldo-item-total{ background: rgba(18,184,134,0.18); border-color: rgba(18,184,134,0.35); }
.saldo-label{ font-size:12px; color: rgba(255,255,255,0.65); font-weight:500; }
.saldo-value{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size:19px; font-weight:700; color:#fff; }
.saldo-value.negative{ color:#FF8A8F; }
.saldo-value.muted{ font-size:13px; font-weight:500; color: rgba(255,255,255,0.55); }

/* Categories */
.chips-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
.category-card{
  background: var(--card-bg); border:1px solid var(--border); border-radius: var(--radius-md);
  padding: 14px 16px; display:flex; align-items:center; gap:12px; box-shadow: var(--shadow-sm);
}
.category-color{ width:14px; height:34px; border-radius:6px; flex-shrink:0; }
.category-info{ display:flex; flex-direction:column; flex:1; min-width:0; }
.category-name{ font-weight:600; font-size:14px; }
.category-total{ font-size:12px; color: var(--muted); }

/* Goals */
.goals-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:16px; }
.goal-card{
  background: var(--card-bg); border:1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px; box-shadow: var(--shadow-sm);
}
.goal-card.over{ border-color: #F3C4C6; }
.goal-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.goal-dot{ width:10px; height:10px; border-radius:50%; }
.goal-name{ font-weight:600; font-size:14.5px; flex:1; }
.goal-bar{ height:9px; background:#EEF1F3; border-radius:10px; overflow:hidden; margin-bottom:8px; }
.goal-bar-fill{ height:100%; border-radius:10px; transition: width .3s ease; }
.goal-numbers{ display:flex; justify-content:space-between; font-size:12.5px; color: var(--muted); }
.text-danger{ color: var(--danger); font-weight:700; }
.goal-alert{ margin-top:8px; font-size:12.5px; color: var(--danger); font-weight:600; }
.goal-remaining{ margin-top:8px; font-size:12.5px; color: var(--muted); }
.goal-empty{ font-size:13px; color: var(--muted); }

/* Monthly view bars */
.cat-breakdown{ display:flex; flex-direction:column; gap:14px; }
.cat-bar-row{ display:flex; align-items:center; gap:12px; }
.cat-bar-label{ display:flex; align-items:center; gap:8px; font-size:13px; width:150px; flex-shrink:0; }
.cat-bar-label .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.cat-bar-track{ flex:1; height:9px; background:#EEF1F3; border-radius:10px; overflow:hidden; }
.cat-bar-fill{ height:100%; border-radius:10px; }
.cat-bar-value{ width:100px; text-align:right; font-size:13px; font-weight:600; }

/* Config page */
.config-desc{ color: var(--muted); font-size:13.5px; margin-bottom:14px; line-height:1.5; }

/* ---------- Modal ---------- */
.modal-overlay{
  position: fixed; inset:0; background: rgba(14,20,25,0.5);
  display:flex; align-items:center; justify-content:center;
  z-index: 100; opacity:0; pointer-events:none; transition: opacity .2s ease;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.modal-overlay.active{ opacity:1; pointer-events:auto; }
.modal-content{
  background:#fff; border-radius: var(--radius-lg);
  max-width: 560px; width:100%;
  max-height: 88vh; overflow-y:auto;
  box-shadow: var(--shadow-md);
  transform: translateY(10px) scale(.98); transition: transform .2s ease;
}
.modal-overlay.active .modal-content{ transform:none; }
.modal-form{ padding: 26px 28px 24px; }
.modal-form h2{ font-size:19px; margin-bottom:18px; }
.confirm-sub{ color: var(--muted); font-size:13.5px; margin:-10px 0 18px; }
.confirm-sub strong{ color: var(--ink); font-family: var(--font-mono); }
.form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:14px 16px; }
.form-grid label{ display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color: var(--ink); }
.form-grid label span{ color: var(--muted); font-weight:500; font-size:12.5px; }
.form-grid .span-2{ grid-column: 1 / -1; }
.form-grid input, .form-grid select, .form-grid textarea{
  border:1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size:14px; color: var(--ink); background:#FBFCFD;
}
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus{
  outline: none; border-color: var(--accent); background:#fff;
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.form-grid input[type="color"]{ padding:4px; height:40px; cursor:pointer; }
.form-grid textarea{ resize: vertical; font-family: inherit; }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
.confirm-box p{ color: var(--muted); font-size:14px; margin-top:8px; line-height:1.5; }

.installment-preview{ margin-top:16px; background:#F7F9FA; border-radius: var(--radius-md); padding:14px 16px; }
.preview-title{ font-size:12.5px; font-weight:700; color: var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.04em; }
.preview-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap:8px 14px; max-height:160px; overflow-y:auto; }
.preview-item{ display:flex; flex-direction:column; font-size:12px; }
.preview-item span{ color: var(--muted); }
.preview-item strong{ font-size:13px; }

/* ---------- Toast ---------- */
.toast{
  position: fixed; bottom:24px; left:50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color:#fff; padding: 12px 20px; border-radius: 10px;
  font-size:13.5px; font-weight:500; opacity:0; pointer-events:none;
  transition: all .25s ease; z-index: 200; box-shadow: var(--shadow-md);
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

/* ---------- Mobile nav ---------- */
.nav-toggle-btn{ display:none; }
.nav-overlay{ display:none; }

@media (max-width: 980px){
  .cards-grid{ grid-template-columns: repeat(2, 1fr); }
  .charts-grid{ grid-template-columns: 1fr; }
  .charts-grid-2{ grid-template-columns: 1fr; }
}

@media (max-width: 720px){
  .topbar{ display:flex; }
  .content{ padding: 20px 16px 60px; }
  .sidebar{
    position: fixed; left:0; top:0; height:100vh;
    transform: translateX(-100%);
    transition: transform .25s ease;
    width: 250px;
  }
  body.nav-open .sidebar{ transform: translateX(0); }
  .nav-overlay{
    display:none;
    position: fixed; inset:0; background: rgba(0,0,0,0.4); z-index:39;
  }
  body.nav-open .nav-overlay{ display:block; }
  .nav-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:8px; border:1px solid var(--border);
    background:#fff; color: var(--ink);
  }
  .cards-grid{ grid-template-columns: 1fr 1fr; }
  .page-header{ flex-direction:column; align-items:stretch; }
  .form-grid{ grid-template-columns: 1fr; }
  .month-switch{ align-self:flex-start; }
}

@media (max-width: 480px){
  .cards-grid{ grid-template-columns: 1fr; }
}

body.modal-open{ overflow:hidden; }

<body>

<div class="app-shell">

  <div class="nav-overlay" id="navOverlay"></div>

  <aside class="sidebar" id="sidebar">

<script>
/* =========================================================
   Vortex Finance v0.5 — Controle Financeiro Pessoal
   Armazenamento: localStorage puro. Sem backend.
   ========================================================= */

/* ---------- Utilidades ---------- */
const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTH_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function uid(prefix){
  return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}

function brl(value){
  const n = Number(value) || 0;
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}

function pad2(n){ return String(n).padStart(2,'0'); }

function ymKey(year, month){ return year + '-' + pad2(month+1); }

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function parseISODate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDateBR(iso){
  if(!iso) return '';
  const d = parseISODate(iso);
  return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();
}

function escapeHTML(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

// Cor padrão de um cartão quando o usuário não escolhe nenhuma.
const DEFAULT_CARD_COLOR = '#101823';

// Clareia (percent > 0) ou escurece (percent < 0) uma cor hexadecimal — usado para
// montar o degradê do cartão a partir da cor escolhida pelo usuário.
function shadeColor(hex, percent){
  hex = (hex || DEFAULT_CARD_COLOR).replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex, 16) || 0;
  let r = (num >> 16) + Math.round(2.55 * percent);
  let g = ((num >> 8) & 0xFF) + Math.round(2.55 * percent);
  let b = (num & 0xFF) + Math.round(2.55 * percent);
  r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
  const toHex = v => v.toString(16).padStart(2, '0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

// Converte texto digitado em formato brasileiro (ex: "1.200,50", "150,50", "150.50", "150")
// em um número float confiável. Retorna NaN se não for possível interpretar.
function parseCurrencyBR(str){
  if(typeof str === 'number') return str;
  if(!str) return NaN;
  let s = String(str).trim().replace(/[^0-9.,-]/g, '');
  if(!s) return NaN;
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  if(hasComma && hasDot){
    // "1.200,50" -> ponto é separador de milhar, vírgula é decimal
    s = s.replace(/\./g, '').replace(',', '.');
  } else if(hasComma){
    // "150,50" -> vírgula é decimal
    s = s.replace(',', '.');
  }
  // se só tem ponto, assume que já é decimal ("150.50")
  const n = parseFloat(s);
  return n;
}

function addMonths(year, month, delta){
  let m = month + delta;
  let y = year;
  while(m > 11){ m -= 12; y += 1; }
  while(m < 0){ m += 12; y -= 1; }
  return { year: y, month: m };
}

/* ---------- Camada de dados (Store) ---------- */
// Prefixo interno do localStorage. Mantido como "fincontrol_" (nome anterior do app)
// de propósito: mudar esta string apagaria os dados já salvos de quem já usa o app.
// Isso é apenas um identificador técnico interno — não aparece em nenhum lugar da interface.
const STORAGE_PREFIX = 'fincontrol_';

const Store = {
  keys: {
    categories: STORAGE_PREFIX + 'categories',
    cards: STORAGE_PREFIX + 'cards',
    expenses: STORAGE_PREFIX + 'expenses',
    fixed: STORAGE_PREFIX + 'fixed',
    fixedPayments: STORAGE_PREFIX + 'fixedPayments',
    fixedOverrides: STORAGE_PREFIX + 'fixedOverrides',
    goals: STORAGE_PREFIX + 'goals',
    incomes: STORAGE_PREFIX + 'incomes',
    investments: STORAGE_PREFIX + 'investments',
    cardPayments: STORAGE_PREFIX + 'cardPayments',
    cardClosingOverrides: STORAGE_PREFIX + 'cardClosingOverrides',
    investmentRedemptions: STORAGE_PREFIX + 'investmentRedemptions',
    users: STORAGE_PREFIX + 'users',
    usersMigrated: STORAGE_PREFIX + 'usersMigratedV1',
    seeded: STORAGE_PREFIX + 'seeded',
    // Metadados da sincronização com o Google Drive (não fazem parte do backup/export).
    googleClientId: STORAGE_PREFIX + 'googleClientId',
    driveConnected: STORAGE_PREFIX + 'driveConnected',
    driveFileId: STORAGE_PREFIX + 'driveFileId',
    driveLastSync: STORAGE_PREFIX + 'driveLastSync',
    driveDirtyAt: STORAGE_PREFIX + 'driveDirtyAt'
  },
  _get(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(raw === null) return fallback;
      return JSON.parse(raw);
    }catch(e){
      console.error('Erro ao ler storage', key, e);
      return fallback;
    }
  },
  _set(key, value){
    try{
      localStorage.setItem(key, JSON.stringify(value));
      // Sempre que um dado real do app muda, avisa o serviço de sincronização
      // (se ele já tiver sido inicializado) para agendar um envio ao Drive.
      if(typeof SYNCABLE_STORE_KEYS !== 'undefined' && SYNCABLE_STORE_KEYS.has(key)){
        if(typeof CloudSync !== 'undefined' && CloudSync.markDirty) CloudSync.markDirty();
      }
      return true;
    }catch(e){
      console.error('Erro ao salvar storage', key, e);
      return false;
    }
  },
  getCategories(){ return this._get(this.keys.categories, []); },
  setCategories(v){ return this._set(this.keys.categories, v); },
  getCards(){ return this._get(this.keys.cards, []); },
  setCards(v){ return this._set(this.keys.cards, v); },
  getExpenses(){ return this._get(this.keys.expenses, []); },
  setExpenses(v){ return this._set(this.keys.expenses, v); },
  getFixed(){ return this._get(this.keys.fixed, []); },
  setFixed(v){ return this._set(this.keys.fixed, v); },
  getFixedPayments(){ return this._get(this.keys.fixedPayments, {}); },
  setFixedPayments(v){ return this._set(this.keys.fixedPayments, v); },
  getFixedOverrides(){ return this._get(this.keys.fixedOverrides, {}); },
  setFixedOverrides(v){ return this._set(this.keys.fixedOverrides, v); },
  getGoals(){ return this._get(this.keys.goals, []); },
  setGoals(v){ return this._set(this.keys.goals, v); },
  getIncomes(){ return this._get(this.keys.incomes, []); },
  setIncomes(v){ return this._set(this.keys.incomes, v); },
  getInvestments(){ return this._get(this.keys.investments, []); },
  setInvestments(v){ return this._set(this.keys.investments, v); },
  getCardPayments(){ return this._get(this.keys.cardPayments, []); },
  setCardPayments(v){ return this._set(this.keys.cardPayments, v); },
  getCardClosingOverrides(){ return this._get(this.keys.cardClosingOverrides, {}); },
  setCardClosingOverrides(v){ return this._set(this.keys.cardClosingOverrides, v); },
  getInvestmentRedemptions(){ return this._get(this.keys.investmentRedemptions, []); },
  setInvestmentRedemptions(v){ return this._set(this.keys.investmentRedemptions, v); },
  getUsers(){ return this._get(this.keys.users, []); },
  setUsers(v){ return this._set(this.keys.users, v); },

  exportAll(){
    return {
      version: 1,
      exportedAt: new Date().toISOString(),
      categories: this.getCategories(),
      cards: this.getCards(),
      expenses: this.getExpenses(),
      fixed: this.getFixed(),
      fixedPayments: this.getFixedPayments(),
      fixedOverrides: this.getFixedOverrides(),
      goals: this.getGoals(),
      incomes: this.getIncomes(),
      investments: this.getInvestments(),
      cardPayments: this.getCardPayments(),
      cardClosingOverrides: this.getCardClosingOverrides(),
      investmentRedemptions: this.getInvestmentRedemptions(),
      users: this.getUsers()
    };
  },
  importAll(data){
    if(!data || typeof data !== 'object') throw new Error('Arquivo inválido');
    if(Array.isArray(data.categories)) this.setCategories(data.categories);
    if(Array.isArray(data.cards)) this.setCards(data.cards);
    if(Array.isArray(data.expenses)) this.setExpenses(data.expenses);
    if(Array.isArray(data.fixed)) this.setFixed(data.fixed);
    if(data.fixedPayments && typeof data.fixedPayments === 'object') this.setFixedPayments(data.fixedPayments);
    if(data.fixedOverrides && typeof data.fixedOverrides === 'object') this.setFixedOverrides(data.fixedOverrides);
    if(Array.isArray(data.goals)) this.setGoals(data.goals);
    if(Array.isArray(data.incomes)) this.setIncomes(data.incomes);
    if(Array.isArray(data.investments)) this.setInvestments(data.investments);
    if(Array.isArray(data.cardPayments)) this.setCardPayments(data.cardPayments);
    if(data.cardClosingOverrides && typeof data.cardClosingOverrides === 'object') this.setCardClosingOverrides(data.cardClosingOverrides);
    if(Array.isArray(data.investmentRedemptions)) this.setInvestmentRedemptions(data.investmentRedemptions);
    if(Array.isArray(data.users)) this.setUsers(data.users);
  }
};

// Chaves do Store que representam dados reais do usuário — são as únicas que,
// ao serem alteradas, devem disparar uma sincronização com o Google Drive.
// (Propositalmente exclui metadados internos como "seeded" e as próprias
// chaves de controle da sincronização, para não criar loops nem ruído.)
const SYNCABLE_STORE_KEYS = new Set([
  Store.keys.categories, Store.keys.cards, Store.keys.expenses, Store.keys.fixed,
  Store.keys.fixedPayments, Store.keys.fixedOverrides, Store.keys.goals, Store.keys.incomes,
  Store.keys.investments, Store.keys.cardPayments, Store.keys.cardClosingOverrides,
  Store.keys.investmentRedemptions, Store.keys.users
]);

/* =========================================================================
   SINCRONIZAÇÃO COM O GOOGLE DRIVE (appDataFolder)
   ---------------------------------------------------------------------
   Três serviços com responsabilidade única:
     - GoogleAuth : login/logout e obtenção de token de acesso válido
     - DriveFiles : chamadas cruas à API do Drive (sem regra de negócio)
     - CloudSync  : orquestra tudo (primeira sincronização, auto-sync
                    "debounced" a cada mudança, resolução de conflito
                    simples por "quem mudou mais recente vence")
   Os dados salvos no Drive são exatamente o JSON de Store.exportAll(),
   o mesmo formato já usado no backup manual — então importar/exportar
   continuam 100% compatíveis com o que vem da nuvem.
   ========================================================================= */

// Client ID padrão (opcional): pode ser deixado em branco aqui e configurado
// depois direto na tela Configurações → Nuvem, sem precisar editar código.
const GOOGLE_CLIENT_ID_DEFAULT = '';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
// Nome do arquivo salvo no Google Drive. Mantido como "nexus-finance-data.json"
// (nome anterior do app) de propósito: quem já conectou o Google Drive antes
// dessa renomeação continua encontrando o mesmo arquivo — mudar isso faria o
// app "perder" os dados já sincronizados na nuvem. É só um identificador
// técnico interno, não aparece em nenhum lugar da interface.
const DRIVE_FILE_NAME = 'nexus-finance-data.json';

/* ---------- Serviço de Autenticação ---------- */
const GoogleAuth = {
  _tokenClient: null,
  _accessToken: null,
  _tokenExpiresAt: 0,
  _listeners: [],
  _pendingResolvers: [],
  _initTried: false,

  getClientId(){
    return (localStorage.getItem(Store.keys.googleClientId) || '').trim() || GOOGLE_CLIENT_ID_DEFAULT;
  },
  setClientId(id){
    localStorage.setItem(Store.keys.googleClientId, (id||'').trim());
  },
  isConfigured(){
    return !!this.getClientId();
  },
  isGisAvailable(){
    return typeof google !== 'undefined' && !!(google.accounts && google.accounts.oauth2);
  },

  // Prepara o cliente de token do Google Identity Services. Pode ser chamado
  // várias vezes sem problema (ex: depois que o usuário salva um novo Client ID).
  init(){
    this._initTried = true;
    if(!this.isConfigured() || !this.isGisAvailable()) return false;
    try{
      this._tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: this.getClientId(),
        scope: GOOGLE_DRIVE_SCOPE,
        callback: (resp) => this._onTokenResponse(resp)
      });
      return true;
    }catch(e){
      console.error('Falha ao inicializar Google Identity Services', e);
      return false;
    }
  },

  _onTokenResponse(resp){
    if(resp && resp.access_token){
      this._accessToken = resp.access_token;
      this._tokenExpiresAt = Date.now() + ((Number(resp.expires_in) || 3600) * 1000) - 60000;
      localStorage.setItem(Store.keys.driveConnected, '1');
      this._resolvePending(null, this._accessToken);
      this._notify('signed-in');
    } else {
      const err = (resp && resp.error) || 'unknown_error';
      this._resolvePending(err, null);
      this._notify('error', err);
    }
  },
  _resolvePending(err, token){
    const list = this._pendingResolvers; this._pendingResolvers = [];
    list.forEach(({resolve, reject}) => err ? reject(new Error(err)) : resolve(token));
  },

  // Ação explícita do usuário — precisa de interação (pode abrir popup de consentimento).
  connect(){
    if(!this._tokenClient && !this.init()){
      this._notify('error', 'not_available');
      return;
    }
    this._tokenClient.requestAccessToken({ prompt: 'consent' });
  },

  disconnect(){
    if(this._accessToken && this.isGisAvailable()){
      try{ google.accounts.oauth2.revoke(this._accessToken, ()=>{}); }catch(e){}
    }
    this._accessToken = null;
    this._tokenExpiresAt = 0;
    localStorage.removeItem(Store.keys.driveConnected);
    localStorage.removeItem(Store.keys.driveFileId);
    localStorage.removeItem(Store.keys.driveLastSync);
    this._notify('signed-out');
  },

  wasConnected(){ return localStorage.getItem(Store.keys.driveConnected) === '1'; },
  isSignedIn(){ return !!this._accessToken; },

  // Retorna um token válido, renovando silenciosamente se necessário.
  // Se a renovação silenciosa falhar (ex: consentimento revogado), rejeita —
  // quem chamou decide se deve pedir para o usuário reconectar manualmente.
  getToken(){
    if(this._accessToken && Date.now() < this._tokenExpiresAt){
      return Promise.resolve(this._accessToken);
    }
    if(!this._tokenClient && !this.init()){
      return Promise.reject(new Error('not_available'));
    }
    return new Promise((resolve, reject) => {
      this._pendingResolvers.push({ resolve, reject });
      this._tokenClient.requestAccessToken({ prompt: '' });
    });
  },

  onChange(cb){ this._listeners.push(cb); },
  _notify(event, detail){ this._listeners.forEach(cb => { try{ cb(event, detail); }catch(e){} }); }
};

/* ---------- Serviço de arquivos do Drive (chamadas cruas à API) ---------- */
const DriveFiles = {
  BASE: 'https://www.googleapis.com/drive/v3/files',
  UPLOAD_BASE: 'https://www.googleapis.com/upload/drive/v3/files',

  async findAppDataFile(token){
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}'`);
    const url = `${this.BASE}?spaces=appDataFolder&fields=files(id,name,modifiedTime)&q=${q}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if(!res.ok) throw await this._error(res);
    const data = await res.json();
    return (data.files && data.files[0]) || null;
  },

  async downloadFile(token, fileId){
    const res = await fetch(`${this.BASE}/${fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if(!res.ok) throw await this._error(res);
    return res.json();
  },

  async createFile(token, content){
    const metadata = { name: DRIVE_FILE_NAME, parents: ['appDataFolder'] };
    const { boundary, body } = this._buildMultipart(metadata, content);
    const res = await fetch(`${this.UPLOAD_BASE}?uploadType=multipart&fields=id,modifiedTime`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    if(!res.ok) throw await this._error(res);
    return res.json();
  },

  async updateFile(token, fileId, content){
    const { boundary, body } = this._buildMultipart({}, content);
    const res = await fetch(`${this.UPLOAD_BASE}/${fileId}?uploadType=multipart&fields=id,modifiedTime`, {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    if(!res.ok) throw await this._error(res);
    return res.json();
  },

  async deleteFile(token, fileId){
    const res = await fetch(`${this.BASE}/${fileId}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` }
    });
    if(!res.ok && res.status !== 404) throw await this._error(res);
    return true;
  },

  _buildMultipart(metadata, content){
    const boundary = 'nexusfinance_' + Math.random().toString(36).slice(2);
    const delimiter = `\r\n--${boundary}\r\n`;
    const closeDelim = `\r\n--${boundary}--`;
    const body =
      delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) +
      delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(content) +
      closeDelim;
    return { boundary, body };
  },

  async _error(res){
    let detail = '';
    try{ detail = JSON.stringify(await res.json()); }catch(e){}
    const err = new Error(`Drive API respondeu ${res.status}${detail ? ': ' + detail : ''}`);
    err.status = res.status;
    return err;
  }
};

/* ---------- Orquestração da sincronização ---------- */
const CloudSync = {
  status: 'idle', // idle | syncing | error | offline | not-configured
  lastError: null,
  lastSyncedAt: 0,
  _fileId: null,
  _debounceTimer: null,
  _listeners: [],
  _suppressDirty: false,
  DEBOUNCE_MS: 4000,

  init(){
    this.lastSyncedAt = Number(localStorage.getItem(Store.keys.driveLastSync) || 0);
    this._fileId = localStorage.getItem(Store.keys.driveFileId) || null;

    GoogleAuth.onChange((event, detail) => {
      if(event === 'signed-in'){ this.syncNow('login'); }
      else if(event === 'signed-out'){ this._setStatus('idle'); }
      else if(event === 'error'){ this._setStatus('error', this._friendlyAuthError(detail)); }
    });

    window.addEventListener('online', () => { if(GoogleAuth.isSignedIn()) this.syncNow('reconnect'); });
    window.addEventListener('offline', () => this._setStatus('offline'));

    if(!navigator.onLine){ this._setStatus('offline'); }
  },

  _friendlyAuthError(code){
    if(code === 'not_available') return 'Serviço de login do Google não carregou (sem conexão ou bloqueado).';
    if(code === 'popup_closed' || code === 'access_denied') return 'Conexão cancelada pelo usuário.';
    return 'Não foi possível autenticar com o Google.';
  },

  onChange(cb){ this._listeners.push(cb); },
  _setStatus(status, error){
    this.status = status;
    this.lastError = error || null;
    this._listeners.forEach(cb => { try{ cb(status, error); }catch(e){} });
  },

  // Chamado pelo Store toda vez que um dado real muda. Não sincroniza na hora —
  // agenda um envio alguns segundos depois do último silêncio, pra agrupar
  // várias mudanças seguidas numa única chamada de rede.
  markDirty(){
    if(this._suppressDirty) return;
    localStorage.setItem(Store.keys.driveDirtyAt, String(Date.now()));
    if(!GoogleAuth.isSignedIn()) return;
    clearTimeout(this._debounceTimer);
    this._debounceTimer = setTimeout(() => this.syncNow('auto'), this.DEBOUNCE_MS);
  },

  async syncNow(reason){
    if(!GoogleAuth.isConfigured()){ this._setStatus('not-configured'); return; }
    if(!navigator.onLine){ this._setStatus('offline'); return; }
    if(!GoogleAuth.isSignedIn()) return;
    if(this.status === 'syncing') return;

    this._setStatus('syncing');
    try{
      const token = await GoogleAuth.getToken();
      const remoteMeta = await DriveFiles.findAppDataFile(token);
      const dirtyAt = Number(localStorage.getItem(Store.keys.driveDirtyAt) || 0);
      const hasLocalChanges = dirtyAt > this.lastSyncedAt;

      if(!remoteMeta){
        // Primeira vez desta conta: ainda não existe nada no Drive — cria com os dados locais.
        const created = await DriveFiles.createFile(token, Store.exportAll());
        this._fileId = created.id;
        localStorage.setItem(Store.keys.driveFileId, this._fileId);
        this._markSynced();
        this._setStatus('idle');
        return;
      }

      this._fileId = remoteMeta.id;
      localStorage.setItem(Store.keys.driveFileId, this._fileId);
      const remoteModified = new Date(remoteMeta.modifiedTime).getTime();
      const remoteIsNewer = remoteModified > this.lastSyncedAt;

      if(remoteIsNewer && hasLocalChanges){
        // Conflito simples: quem mudou por último vence.
        if(remoteModified >= dirtyAt) await this._pull(token);
        else await this._push(token);
      } else if(remoteIsNewer){
        await this._pull(token);
      } else if(hasLocalChanges){
        await this._push(token);
      }
      this._setStatus('idle');
    }catch(err){
      console.error('Erro de sincronização com o Google Drive:', err);
      this._setStatus('error', err.message || 'Erro desconhecido ao sincronizar.');
    }
  },

  async _pull(token){
    const remoteData = await DriveFiles.downloadFile(token, this._fileId);
    this._suppressDirty = true;
    try{ Store.importAll(remoteData); }
    finally{ this._suppressDirty = false; }
    this._markSynced();
    renderPage(UI.currentPage);
    if(typeof refreshAllSaldos === 'function') refreshAllSaldos();
  },

  async _push(token){
    await DriveFiles.updateFile(token, this._fileId, Store.exportAll());
    this._markSynced();
  },

  _markSynced(){
    this.lastSyncedAt = Date.now();
    localStorage.setItem(Store.keys.driveLastSync, String(this.lastSyncedAt));
  },

  // Usado pela Zona de risco: se o usuário apagar tudo localmente enquanto
  // conectado, também apaga o arquivo remoto — senão a próxima sincronização
  // simplesmente baixaria os dados antigos de volta.
  async deleteRemoteAndDisconnect(){
    if(GoogleAuth.isSignedIn() && this._fileId){
      try{
        const token = await GoogleAuth.getToken();
        await DriveFiles.deleteFile(token, this._fileId);
      }catch(e){ console.warn('Não foi possível apagar o arquivo remoto:', e); }
    }
    GoogleAuth.disconnect();
    this._fileId = null;
    this.lastSyncedAt = 0;
    this._setStatus('idle');
  }
};

// Migração única: versões anteriores do app gravavam o responsável como um nome
// fixo em texto direto nos registros. Agora o responsável é
// uma referência a um usuário cadastrado dinamicamente. Esta função roda uma vez,
// descobre quais nomes já foram usados nos dados existentes, cria um usuário real
// para cada um (preservando o nome) e troca o texto pela referência — sem perder
// nada do que já estava salvo.
function migrateLegacyResponsibleNames(){
  const FLAG = Store.keys.usersMigrated;
  if(localStorage.getItem(FLAG)) return;

  const users = Store.getUsers();
  const byId = {}; users.forEach(u => byId[u.id] = u);
  const byNameLower = {}; users.forEach(u => byNameLower[u.name.toLowerCase()] = u.id);

  function resolve(rawValue){
    if(!rawValue) return rawValue;
    if(byId[rawValue]) return rawValue; // já é uma referência válida
    const key = String(rawValue).toLowerCase();
    if(byNameLower[key]) return byNameLower[key];
    const newUser = { id: uid('user'), name: String(rawValue) };
    users.push(newUser);
    byId[newUser.id] = newUser;
    byNameLower[key] = newUser.id;
    return newUser.id;
  }

  let touched = false;

  const expenses = Store.getExpenses().map(e => {
    if(!e.responsible) return e;
    const resolved = resolve(e.responsible);
    if(resolved !== e.responsible){ touched = true; return { ...e, responsible: resolved }; }
    return e;
  });
  const incomes = Store.getIncomes().map(i => {
    if(!i.responsible) return i;
    const resolved = resolve(i.responsible);
    if(resolved !== i.responsible){ touched = true; return { ...i, responsible: resolved }; }
    return i;
  });
  const investments = Store.getInvestments().map(i => {
    if(!i.responsible) return i;
    const resolved = resolve(i.responsible);
    if(resolved !== i.responsible){ touched = true; return { ...i, responsible: resolved }; }
    return i;
  });

  if(touched || users.length > Store.getUsers().length){
    Store.setUsers(users);
    Store.setExpenses(expenses);
    Store.setIncomes(incomes);
    Store.setInvestments(investments);
  }
  localStorage.setItem(FLAG, '1');
}

/* ---------- Cálculos financeiros ---------- */

// Distribui um valor total em N parcelas, corrigindo arredondamento na última.
function splitInstallments(total, n){
  n = Math.max(1, parseInt(n,10) || 1);
  const base = Math.floor((total / n) * 100) / 100;
  const values = new Array(n).fill(base);
  const usedSoFar = base * (n - 1);
  values[n-1] = Math.round((total - usedSoFar) * 100) / 100;
  return values;
}

// Calcula em qual mês/ano cai a primeira parcela, considerando fechamento do cartão.
// Dia de fechamento "efetivo" de um cartão num mês específico: usa o ajuste
function daysInMonth(year, month){
  return new Date(year, month+1, 0).getDate();
}

// Data de fechamento "efetiva" da fatura de um cartão num mês (ano/mês da FATURA,
// não necessariamente da data de fechamento em si — a fatura de agosto pode
// fechar em julho). Usa o ajuste manual daquele mês se existir (uma data
// completa), senão usa o dia padrão cadastrado no cartão dentro do próprio mês.
// Aceita também o formato antigo de ajuste (só um número de dia), para não
// quebrar quem já tinha configurado isso antes desta versão.
function getEffectiveClosingDate(card, year, month){
  const overrides = Store.getCardClosingOverrides();
  const key = card.id + '_' + ymKey(year, month);
  const override = overrides[key];
  if(override !== undefined && override !== null && override !== ''){
    if(typeof override === 'string' && override.includes('-')){
      return parseISODate(override); // formato novo: data completa (pode ser de outro mês)
    }
    const day = clamp(Number(override), 1, daysInMonth(year, month));
    return new Date(year, month, day); // formato antigo: só o número do dia
  }
  const day = clamp(Number(card.closingDay) || daysInMonth(year, month), 1, daysInMonth(year, month));
  return new Date(year, month, day);
}

// Mantido por compatibilidade com quem só precisa do número do dia (ex: exibir
// "vence antes/depois do fechamento"). Extrai o dia da data de fechamento efetiva.
function getEffectiveClosingDay(card, year, month){
  return getEffectiveClosingDate(card, year, month).getDate();
}

// Descobre a qual fatura (ano/mês) uma compra pertence, comparando a data da
// compra com a data de fechamento efetiva de cada fatura candidata — já que a
// data de fechamento de uma fatura pode estar no mês anterior ao dela.
function findInvoicePeriodForDate(d, card){
  let year = d.getFullYear(), month = d.getMonth();
  for(let i = 0; i < 4; i++){
    const closing = getEffectiveClosingDate(card, year, month);
    if(d <= closing){
      return { year, month };
    }
    const next = addMonths(year, month, 1);
    year = next.year; month = next.month;
  }
  return { year, month };
}

function firstInstallmentPeriod(dateISO, card){
  const d = parseISODate(dateISO);
  let month = d.getMonth();
  let year = d.getFullYear();
  if(card && card.closingDay){
    // 1) Descobre em qual fatura a compra cai, considerando que a data de
    // fechamento de cada fatura pode estar em outro mês (ex: fatura de agosto
    // fechando em 27 de julho).
    const cycle = findInvoicePeriodForDate(d, card);
    month = cycle.month; year = cycle.year;
    // 2) A maioria dos bancos nomeia a fatura pelo mês em que ela VENCE (é paga),
    // não pelo mês em que fecha. Se o vencimento cai num dia menor ou igual ao
    // dia de fechamento (do ciclo já determinado acima), isso significa que o
    // vencimento é no mês seguinte ao fechamento (ex: fecha dia 25, vence dia 5
    // → vence no mês seguinte). Nesse caso, a fatura "empurra" mais um mês.
    const closingOfCycle = getEffectiveClosingDay(card, year, month);
    if(card.dueDay != null && card.dueDay !== '' && Number(card.dueDay) <= closingOfCycle){
      const dueShift = addMonths(year, month, 1);
      month = dueShift.month; year = dueShift.year;
    }
  }
  return { year, month };
}

// Gera o detalhamento de parcelas de uma despesa (array de {year, month, value, seq}).
function buildInstallmentSchedule(expense, card){
  const n = Math.max(1, parseInt(expense.installments,10) || 1);
  const values = splitInstallments(Number(expense.value) || 0, n);
  const start = firstInstallmentPeriod(expense.date, card);
  const schedule = [];
  for(let i=0; i<n; i++){
    const p = addMonths(start.year, start.month, i);
    schedule.push({ seq: i+1, total: n, year: p.year, month: p.month, value: values[i] });
  }
  return schedule;
}

// Retorna todos os "lançamentos efetivos" (já explodindo parcelas) de um mês/ano.
function getEffectiveEntriesForMonth(year, month){
  const expenses = Store.getExpenses();
  const cards = Store.getCards();
  const cardById = {};
  cards.forEach(c => cardById[c.id] = c);
  const entries = [];

  expenses.forEach(exp => {
    const n = Math.max(1, parseInt(exp.installments,10) || 1);
    const isCardPurchase = exp.paymentMethod === 'credito' && exp.cardId;
    if(n <= 1 && !isCardPurchase){
      // Pagamentos que não passam por fatura (dinheiro, pix, débito, transferência,
      // ou crédito sem cartão vinculado) contam sempre no mês exato da data.
      const d = parseISODate(exp.date);
      if(d.getFullYear() === year && d.getMonth() === month){
        entries.push({
          type: 'expense', expenseId: exp.id, description: exp.description,
          categoryId: exp.categoryId, cardId: exp.cardId, paymentMethod: exp.paymentMethod,
          value: Number(exp.value) || 0, date: exp.date, note: exp.note, responsible: exp.responsible || '',
          installmentLabel: null
        });
      }
    } else {
      // Toda compra no cartão (parcelada ou não) passa pela mesma lógica de fatura,
      // respeitando o dia de fechamento do cartão para decidir em qual mês ela cai —
      // e, quando parcelada, projetando corretamente cada parcela futura.
      const schedule = buildInstallmentSchedule(exp, cardById[exp.cardId]);
      const hit = schedule.find(s => s.year === year && s.month === month);
      if(hit){
        entries.push({
          type: 'expense', expenseId: exp.id, description: exp.description,
          categoryId: exp.categoryId, cardId: exp.cardId, paymentMethod: exp.paymentMethod,
          value: hit.value, date: exp.date, note: exp.note, responsible: exp.responsible || '',
          installmentLabel: n > 1 ? (hit.seq + '/' + hit.total) : null
        });
      }
    }
  });

  return entries;
}

// Gastos fixos aplicados a um mês (assume-se recorrência mensal a partir do cadastro).
function getFixedEntriesForMonth(year, month){
  const fixed = Store.getFixed();
  const payments = Store.getFixedPayments();
  const overrides = Store.getFixedOverrides();
  const key = ymKey(year, month);
  return fixed.map(f => {
    const monthKey = f.id + '_' + key;
    const rec = payments[monthKey];
    const paid = !!(rec && (rec === true || rec.paid));
    const hasOverride = overrides[monthKey] !== undefined && overrides[monthKey] !== null;
    const value = hasOverride ? Number(overrides[monthKey]) : (Number(f.expectedValue) || 0);
    return {
      type: 'fixed', fixedId: f.id, description: f.name, categoryId: f.categoryId,
      value, expectedValue: Number(f.expectedValue) || 0, isOverridden: hasOverride,
      payDay: f.payDay, frequency: f.frequency,
      paid: paid,
      method: (rec && typeof rec === 'object') ? (rec.method || '') : '',
      cardId: (rec && typeof rec === 'object') ? (rec.cardId || '') : ''
    };
  });
}

// <option>s padrão para qualquer <select> de "responsável" no sistema, sempre
// carregadas dinamicamente da lista de usuários cadastrados em Configurações → Usuários.
// Monta as <option>s de um seletor de responsável, sempre carregadas dinamicamente
// da lista de usuários cadastrados.
// mode 'form'   (padrão): usado nos formulários de gasto/entrada/investimento.
//   - Se não há NENHUM usuário cadastrado, tudo é implicitamente do usuário padrão
//     "Você" (única opção, o app inteiro se comporta como se só existisse essa pessoa).
//   - Assim que existir pelo menos um usuário, "Você" deixa de ser uma opção — só os
//     usuários cadastrados aparecem, forçando a escolha de um responsável real.
// mode 'filter': usado nos filtros de listagem, que já têm sua própria opção "Todos"
//   escrita à parte — aqui nunca incluímos "Você" para não colidir com ela.
function userOptionsHTML(selectedId, mode){
  const users = Store.getUsers();
  if(mode === 'filter'){
    return users.map(u => `<option value="${u.id}" ${selectedId===u.id?'selected':''}>${escapeHTML(u.name)}</option>`).join('');
  }
  if(users.length === 0){
    return `<option value="" selected>Você</option>`;
  }
  return users.map(u => `<option value="${u.id}" ${selectedId===u.id?'selected':''}>${escapeHTML(u.name)}</option>`).join('');
}

// Total de registros (gastos, entradas e investimentos) que referenciam um usuário —

function countUserUsage(userId){

  count += Store.getIncomes().filter(i => i.responsible === userId).length;
  count += Store.getInvestments().filter(i => i.responsible === userId).length;
  return count;
}

// Total gasto em um mês (despesas + fixos)
function getMonthTotal(year, month){
  const exp = getEffectiveEntriesForMonth(year, month).reduce((s,e)=>s+e.value,0);
  const fix = getFixedEntriesForMonth(year, month).reduce((s,e)=>s+e.value,0);
  return exp + fix;
}

// Totais por categoria em um mês (despesas + fixos)
function getCategoryTotalsForMonth(year, month){
  const totals = {};
  getEffectiveEntriesForMonth(year, month).forEach(e => {
    totals[e.categoryId] = (totals[e.categoryId]||0) + e.value;
  });
  getFixedEntriesForMonth(year, month).forEach(e => {
    totals[e.categoryId] = (totals[e.categoryId]||0) + e.value;
  });
  return totals;
}

// Soma dos gastos fixos marcados como pagos no cartão informado, em um mês específico.
function getFixedCardChargesForMonth(cardId, year, month){
  const key = ymKey(year, month);
  const payments = Store.getFixedPayments();
  let total = 0;
  Store.getFixed().forEach(f => {
    const rec = payments[f.id + '_' + key];
    if(rec && typeof rec === 'object' && rec.paid && rec.method === 'credito' && rec.cardId === cardId){
      total += Number(rec.value != null ? rec.value : f.expectedValue) || 0;
    }
  });
  return total;
}

// Soma de TODOS os gastos fixos já pagos no cartão informado, em qualquer mês (histórico completo).
function getFixedCardChargesTotal(cardId){
  const payments = Store.getFixedPayments();
  let total = 0;
  Object.keys(payments).forEach(key => {
    const rec = payments[key];
    if(rec && typeof rec === 'object' && rec.paid && rec.method === 'credito' && rec.cardId === cardId){
      total += Number(rec.value) || 0;
    }
  });
  return total;
}

// Fatura de um cartão em um mês específico = compras no crédito + gastos fixos pagos no cartão naquele mês.
function getCardInvoiceForMonth(cardId, year, month){
  const fromExpenses = getEffectiveEntriesForMonth(year, month)
    .filter(e => e.cardId === cardId && e.paymentMethod === 'credito')
    .reduce((s,e)=>s+e.value, 0);
  const fromFixed = getFixedCardChargesForMonth(cardId, year, month);
  return fromExpenses + fromFixed;
}

// Lista, item a item, tudo que compõe a fatura de um cartão em um mês: compras
// (com data, descrição, valor e parcela quando houver) e gastos fixos pagos
// naquele cartão naquele mês. Usado no detalhamento de fatura (clicar para ver).
function getCardInvoiceLineItems(cardId, year, month){
  const fromExpenses = getEffectiveEntriesForMonth(year, month)
    .filter(e => e.cardId === cardId && e.paymentMethod === 'credito')
    .map(e => ({
      date: e.date, description: e.description, value: e.value,
      installmentLabel: e.installmentLabel, categoryId: e.categoryId, isFixed: false
    }));

  const payments = Store.getFixedPayments();
  const key = ymKey(year, month);
  const fromFixed = [];
  Store.getFixed().forEach(f => {
    const rec = payments[f.id + '_' + key];
    if(rec && typeof rec === 'object' && rec.paid && rec.method === 'credito' && rec.cardId === cardId){
      fromFixed.push({
        date: rec.date || null, description: f.name + ' (gasto fixo)',
        value: Number(rec.value) || 0, installmentLabel: null, categoryId: f.categoryId, isFixed: true
      });
    }
  });

  return [...fromExpenses, ...fromFixed].sort((a,b) => (a.date||'').localeCompare(b.date||''));
}

// Pagamentos de fatura já registrados para um cartão em um mês específico.
function getCardPaymentsForMonth(cardId, year, month){
  return Store.getCardPayments()
    .filter(p => p.cardId === cardId && p.year === year && p.month === month)
    .reduce((s,p)=>s+Number(p.value||0), 0);
}

// Valor em aberto da fatura de um mês (o que ainda falta pagar).
function getCardOpenInvoiceForMonth(cardId, year, month){
  return Math.max(0, getCardInvoiceForMonth(cardId, year, month) - getCardPaymentsForMonth(cardId, year, month));
}

// Total já cobrado do cartão em toda a história (compras no crédito + fixos pagos no cartão).
function getCardTotalCharged(cardId){
  const fromExpenses = Store.getExpenses()
    .filter(e => e.cardId === cardId && e.paymentMethod === 'credito')
    .reduce((s,e)=>s+(Number(e.value)||0), 0); // valor total da compra já é a soma de todas as parcelas
  const fromFixed = getFixedCardChargesTotal(cardId);
  return fromExpenses + fromFixed;
}

// Total já pago de fatura desse cartão em toda a história.
function getCardTotalPaid(cardId){
  return Store.getCardPayments().filter(p => p.cardId === cardId).reduce((s,p)=>s+Number(p.value||0), 0);
}

// Limite usado de um cartão = total cobrado - total pago (nunca negativo).
function getCardUsage(cardId){
  return Math.max(0, getCardTotalCharged(cardId) - getCardTotalPaid(cardId));
}

// Linha do tempo de faturas de um cartão: meses passados + mês atual + meses futuros,
// sempre ancorada na data real de hoje (independente do mês que está selecionado na tela),
// para que toda parcela pendente já cadastrada apareça automaticamente, sem precisar
// navegar mês a mês. monthsBack/monthsForward definem quantos meses mostrar para cada lado.
function getCardInvoiceTimeline(cardId, monthsBack, monthsForward){
  monthsBack = monthsBack == null ? 2 : monthsBack;
  monthsForward = monthsForward == null ? 4 : monthsForward;
  const today = new Date();
  const todayYear = today.getFullYear();
  const todayMonth = today.getMonth();
  const list = [];
  for(let i = -monthsBack; i <= monthsForward; i++){
    const p = addMonths(todayYear, todayMonth, i);
    const total = getCardInvoiceForMonth(cardId, p.year, p.month);
    const paid = getCardPaymentsForMonth(cardId, p.year, p.month);
    const isFuture = i > 0;
    const isCurrent = i === 0;
    let status = 'aberto';
    if(total <= 0) status = 'sem-gastos';
    else if(paid >= total) status = 'paga';
    else if(isFuture) status = 'prevista';
    else if(paid > 0) status = 'parcial';
    list.push({ year: p.year, month: p.month, total, paid, open: Math.max(0,total-paid), status, isFuture, isCurrent });
  }
  return list;
}

/* ---------- Saldos disponíveis (PIX/Conta e Dinheiro) ---------- */

// Saldo disponível na conta / PIX: entradas recebidas via PIX menos gastos, fixos e
// pagamentos de fatura feitos a partir da conta (pix, débito e transferência).
function getSaldoPix(){
  let total = 0;
  Store.getIncomes().forEach(inc => {
    if((inc.method || 'pix') === 'pix') total += Number(inc.value) || 0;
  });
  Store.getExpenses().forEach(exp => {
    if(BANK_METHODS.includes(exp.paymentMethod)) total -= Number(exp.value) || 0;
  });
  Object.values(Store.getFixedPayments()).forEach(rec => {
    if(rec && typeof rec === 'object' && rec.paid && rec.method === 'pix') total -= Number(rec.value) || 0;
  });
  Store.getCardPayments().forEach(p => {
    if(p.source === 'pix') total -= Number(p.value) || 0;
  });
  Store.getInvestmentRedemptions().forEach(r => {
    if(r.destination === 'pix') total += Number(r.value) || 0;
  });
  return total;
}

// Saldo disponível em dinheiro (espécie).
function getSaldoDinheiro(){
  let total = 0;
  Store.getIncomes().forEach(inc => {
    if((inc.method || 'pix') === 'dinheiro') total += Number(inc.value) || 0;
  });
  Store.getExpenses().forEach(exp => {
    if(exp.paymentMethod === 'dinheiro') total -= Number(exp.value) || 0;
  });
  Object.values(Store.getFixedPayments()).forEach(rec => {
    if(rec && typeof rec === 'object' && rec.paid && rec.method === 'dinheiro') total -= Number(rec.value) || 0;
  });
  Store.getCardPayments().forEach(p => {
    if(p.source === 'dinheiro') total -= Number(p.value) || 0;
  });
  Store.getInvestmentRedemptions().forEach(r => {
    if(r.destination === 'dinheiro') total += Number(r.value) || 0;
  });
  return total;

function getSaldoTotal(){

/* ---------- Entradas (receitas) ---------- */

function getIncomesForMonth(year, month){
  return Store.getIncomes().filter(inc => {
    const d = parseISODate(inc.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });
}

function getIncomeTotalForMonth(year, month){
  return getIncomesForMonth(year, month).reduce((s,i)=>s+Number(i.value||0),0);
}

function getIncomeTotalsByCategory(year, month){
  const totals = {};
  getIncomesForMonth(year, month).forEach(i => {
    totals[i.category] = (totals[i.category]||0) + Number(i.value||0);
  });
  return totals;
}

function getIncomeTotalsByResponsible(year, month){
  const totals = {};
  Store.getUsers().forEach(u => totals[u.id] = 0);
  totals[''] = 0;
  getIncomesForMonth(year, month).forEach(i => {
    const key = totals.hasOwnProperty(i.responsible) ? i.responsible : '';
    totals[key] = (totals[key]||0) + Number(i.value||0);
  });
  return totals;
}

// Total de gastos (lançamentos, sem gastos fixos) por responsável, em um mês.
function getExpenseTotalsByResponsible(year, month){
  const totals = {};
  Store.getUsers().forEach(u => totals[u.id] = 0);
  totals[''] = 0;
  getEffectiveEntriesForMonth(year, month).forEach(e => {
    const key = totals.hasOwnProperty(e.responsible) ? e.responsible : '';
    totals[key] = (totals[key]||0) + Number(e.value||0);
  });
  return totals;
}

/* ---------- Investimentos / Patrimônio ---------- */

// Todos os registros de investimento com data até o final do mês/ano informado (acumulado).
function getInvestmentsUpTo(year, month){
  const lastDay = new Date(year, month+1, 0);
  return Store.getInvestments().filter(inv => parseISODate(inv.date) <= lastDay);
}

// Quantos meses completos se passaram entre a data do investimento e o mês de referência.
function getInvestmentMonthsElapsed(investmentDate, asOfYear, asOfMonth){
  const d = parseISODate(investmentDate);
  const months = (asOfYear - d.getFullYear()) * 12 + (asOfMonth - d.getMonth());
  return Math.max(0, months);
}

// Saldo bruto de um investimento (aporte original + juros compostos pela taxa mensal
// cadastrada), ANTES de descontar qualquer resgate já feito.
function getInvestmentGrossBalance(investment, asOfYear, asOfMonth){
  const months = getInvestmentMonthsElapsed(investment.date, asOfYear, asOfMonth);
  const rate = (Number(investment.monthlyRate) || 0) / 100;
  const principal = Number(investment.value) || 0;
  return principal * Math.pow(1 + rate, months);
}

// Soma de tudo que já foi resgatado desse investimento até um mês de referência.
function getInvestmentRedeemedTotal(investmentId, uptoYear, uptoMonth){
  const lastDay = new Date(uptoYear, uptoMonth+1, 0);
  return Store.getInvestmentRedemptions()
    .filter(r => r.investmentId === investmentId && parseISODate(r.date) <= lastDay)
    .reduce((s,r)=>s+(Number(r.value)||0), 0);
}

// Saldo atual de um investimento = principal + rendimento acumulado - resgates já feitos.
function getInvestmentCurrentBalance(investment, asOfYear, asOfMonth){
  const gross = getInvestmentGrossBalance(investment, asOfYear, asOfMonth);
  const redeemed = getInvestmentRedeemedTotal(investment.id, asOfYear, asOfMonth);
  return Math.max(0, gross - redeemed);
}

// Só o rendimento (juros) acumulado até agora, sem contar o aporte original.
function getInvestmentYieldAccrued(investment, asOfYear, asOfMonth){
  const gross = getInvestmentGrossBalance(investment, asOfYear, asOfMonth);
  return gross - (Number(investment.value) || 0);
}

function getInvestmentTotalsUpTo(year, month){
  const records = getInvestmentsUpTo(year, month);
  let invested = 0, saved = 0, totalYield = 0;
  const byResponsible = {}; Store.getUsers().forEach(u=>byResponsible[u.id]=0); byResponsible[''] = 0;
  records.forEach(r => {
    const balance = getInvestmentCurrentBalance(r, year, month);
    totalYield += getInvestmentYieldAccrued(r, year, month);
    if(SAVED_INVESTMENT_TYPES.includes(r.type)) saved += balance; else invested += balance;
    const key = byResponsible.hasOwnProperty(r.responsible) ? r.responsible : '';
    byResponsible[key] = (byResponsible[key]||0) + balance;
  });
  return { invested, saved, total: invested+saved, byResponsible, totalYield };
}

function getInvestmentTotalsByType(year, month){
  const totals = {};
  getInvestmentsUpTo(year, month).forEach(r => {
    const balance = getInvestmentCurrentBalance(r, year, month);
    totals[r.type] = (totals[r.type]||0) + balance;
  });
  return totals;
}

/* ---------- Renderização: Shell / Navegação ---------- */

function navigateTo(page){
  UI.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  if(target) target.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.target === page);
  });
  document.getElementById('appTitle').textContent = PAGE_TITLES[page] || 'Vortex Finance v0.5';
  closeMobileNav();
  renderPage(page);
}

const PAGE_TITLES = {
  dashboard: 'Dashboard',
  entradas: 'Entradas',
  lancamentos: 'Lançamentos',
  cartoes: 'Cartões de Crédito',
  categorias: 'Categorias',
  fixos: 'Gastos Fixos',
  investimentos: 'Investimentos',
  metas: 'Metas & Orçamento',
  mensal: 'Visão Mensal',
  usuarios: 'Configurações · Usuários',
  nuvem: 'Configurações · Nuvem',
  backup: 'Configurações · Backup'
};

function renderPage(page){
  if(page === 'dashboard') renderDashboard();
  else if(page === 'entradas') renderEntradas();
  else if(page === 'lancamentos') renderLancamentos();
  else if(page === 'cartoes') renderCartoes();
  else if(page === 'categorias') renderCategorias();
  else if(page === 'fixos') renderFixos();
  else if(page === 'investimentos') renderInvestimentos();
  else if(page === 'metas') renderMetas();
  else if(page === 'mensal') renderMensal();
  else if(page === 'usuarios') renderUsuarios();
  else if(page === 'nuvem') renderNuvem();
  else if(page === 'backup') renderBackup();
}

function bindMonthSwitch(container){
  container.querySelectorAll('[data-action="prev-month"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const r = addMonths(UI.selected.year, UI.selected.month, -1);
      UI.selected = r; renderPage(UI.currentPage);
    });
  });
  container.querySelectorAll('[data-action="next-month"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const r = addMonths(UI.selected.year, UI.selected.month, 1);
      UI.selected = r; renderPage(UI.currentPage);
    });
  });
  container.querySelectorAll('[data-action="open-month-picker"]').forEach(btn=>{
    btn.addEventListener('click', ()=> openMonthYearPicker());
  });

// Seletor completo de mês/ano: abre ao clicar no nome do mês em qualquer tela
// que use monthSelectorHTML, permitindo ir direto pra qualquer período e voltar
// rapidamente para o mês atual.
function openMonthYearPicker(){
  const selected = UI.selected;
  const today = new Date();
  let viewYear = selected.year;

  const html = `
    <div class="modal-form month-picker-modal">
      <h2>Selecionar mês</h2>
      <div class="month-picker-year-nav">
        <button type="button" class="icon-btn" id="mpPrevYear">

        </button>
        <span id="mpYearLabel" class="month-picker-year-label"></span>
        <button type="button" class="icon-btn" id="mpNextYear">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <button type="button" class="btn-ghost" data-action="close-modal">Fechar</button>
      </div>
    </div>`;
  openModal(html);

  function renderGrid(){
    document.getElementById('mpYearLabel').textContent = viewYear;
    document.getElementById('mpGrid').innerHTML = MONTH_SHORT.map((m,i) => {
      const isSelected = viewYear === selected.year && i === selected.month;
      const isToday = viewYear === today.getFullYear() && i === today.getMonth();
      return `<button type="button" class="month-picker-cell ${isSelected?'is-selected':''} ${isToday?'is-today':''}" data-month="${i}">${m}</button>`;
    }).join('');
    document.querySelectorAll('.month-picker-cell').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        UI.selected = { year: viewYear, month: Number(btn.dataset.month) };
        closeModal();
        renderPage(UI.currentPage);
      });
    });
  }

  document.getElementById('mpPrevYear').addEventListener('click', ()=>{ viewYear--; renderGrid(); });
  document.getElementById('mpNextYear').addEventListener('click', ()=>{ viewYear++; renderGrid(); });
  document.getElementById('mpToday').addEventListener('click', ()=>{
    UI.selected = { year: today.getFullYear(), month: today.getMonth() };
    closeModal();
    renderPage(UI.currentPage);
  });
  renderGrid();
}

const CHART_PALETTE = ['#12B886','#4C6EF5','#F5A623','#E64980','#15AABF','#7048E8','#E8590C','#868E96','#37B24D','#F03E3E'];

function renderPieChart(year, month, categories, catTotals){
  const ctx = document.getElementById('chartPie');
  const legendEl = document.getElementById('pieLegend');
  if(!ctx) return;
  const labels = [];
  const data = [];
  const colors = [];
  categories.forEach((c, idx) => {
    const v = catTotals[c.id];
    if(v && v > 0){
      labels.push(c.name);
      data.push(Number(v.toFixed(2)));
      colors.push(c.color || CHART_PALETTE[idx % CHART_PALETTE.length]);
    }
  });
  if(UI.charts.pie) UI.charts.pie.destroy();
  if(data.length === 0){
    ctx.parentElement.innerHTML = '<div class="empty-chart">Nenhum gasto registrado neste mês.</div>';
    if(legendEl) legendEl.innerHTML = '';
    return;
  }

  if(legendEl){
    const total = data.reduce((s,v)=>s+v, 0);
    // Monta a legenda ordenada da maior para a menor categoria (mais fácil de ler),
    // sem alterar a ordem/dados usados pelo próprio gráfico abaixo.
    const legendItems = labels.map((name, i) => ({ name, value: data[i], color: colors[i] }))
      .sort((a,b) => b.value - a.value);
    legendEl.innerHTML = legendItems.map(it => {
      const pct = total > 0 ? (it.value/total)*100 : 0;
      const pctLabel = pct.toFixed(1).replace('.', ',');
      return `
        <div class="pie-legend-item">
          <span class="pie-legend-dot" style="background:${it.color}"></span>
          <span class="pie-legend-name">${escapeHTML(it.name)}</span>
          <span class="pie-legend-pct">${pctLabel}%</span>
          <span class="pie-legend-value">${brl(it.value)}</span>
        </div>`;
    }).join('');
  }

  if(typeof Chart === 'undefined'){
    ctx.parentElement.innerHTML = '<div class="empty-chart">Gráfico indisponível (sem conexão com a internet).</div>';
    return;
  }
  UI.charts.pie = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: { legend: { display: false } }
    }
  });
}

  const cards = Store.getCards();

  root.innerHTML = `

      <div>
        <h1>Lançamentos</h1>
        <p class="subtitle">Todos os seus gastos, à vista e parcelados</p>
      </div>
      <div class="header-actions">
        <button class="btn-ghost" id="btnDuplicateLast">${icon('repeat')} Duplicar último</button>
        <button class="btn-primary" id="btnNewExpense">${icon('plus')} Novo gasto</button>
      </div>
    </div>

    <div class="panel saldos-panel">
      <div class="panel-header"><h3>Saldos disponíveis</h3></div>
      <div class="saldos-grid" id="lancamentosSaldosGrid">${saldosDisponiveisGridHTML()}</div>
    </div>

      </select>
      <select id="filterCard">
        <option value="">Todos cartões / formas</option>
